<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#2F5BEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TalkStep">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="생활·비즈니스·여행 영어회화를 실제 대화처럼 연습하고, 틀린 부분은 한국어로 바로 교정받는 학습 앱">
<!--HEAD-START-->
<title>TalkStep 영어회화</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen app. Home = scrolling card grid; Chat = header / message list / composer column, centered at 760px on desktop. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#1B2333; --muted:#5D6880; --line:#DDE2EA;
  --accent:#2F5BEA; --accent-ink:#FFFFFF; --accent-soft:#E6ECFF;
  --ok:#1A7F52; --ok-soft:#E2F3EA; --warn:#9A6411; --warn-soft:#FFF3D6;
  --err:#C9302A; --err-soft:#FDE8E6; --mark:#FFE58A; --mark-ink:#1B2333;
  --bubble-me:#2F5BEA; --bubble-me-ink:#FFFFFF;
  --f-display:"Bricolage Grotesque","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141C; --surface:#182030; --ink:#E7EBF3; --muted:#9AA5BB; --line:#2A3447;
  --accent:#7D9BFF; --accent-ink:#0E1424; --accent-soft:#1F2A4A;
  --ok:#4CC38A; --ok-soft:#14302A; --warn:#E3B45A; --warn-soft:#33290F;
  --err:#FF7A70; --err-soft:#3A1A1A; --mark:#6D5A14; --mark-ink:#FFF6D6;
  --bubble-me:#3D5FD6; --bubble-me-ink:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141C; --surface:#182030; --ink:#E7EBF3; --muted:#9AA5BB; --line:#2A3447;
  --accent:#7D9BFF; --accent-ink:#0E1424; --accent-soft:#1F2A4A;
  --ok:#4CC38A; --ok-soft:#14302A; --warn:#E3B45A; --warn-soft:#33290F;
  --err:#FF7A70; --err-soft:#3A1A1A; --mark:#6D5A14; --mark-ink:#FFF6D6;
  --bubble-me:#3D5FD6; --bubble-me-ink:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---------- Home ---------- */
.top{padding-block:28px 8px;display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,40px);letter-spacing:-.02em;margin:0;line-height:1.05}
.brand span{color:var(--accent)}
.tag{color:var(--muted);margin:0;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-block:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat small{color:var(--muted);font-size:12px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
.resume p{margin:0;min-width:0}
.resume small{color:var(--muted);display:block;font-size:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg small{display:block;font-weight:400;font-size:11px;opacity:.8}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-block:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding-bottom:28px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--accent)}
.card h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.25}
.card .ko{color:var(--muted);font-size:13px;margin:0}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px;font-size:13px;color:var(--muted)}
.lv{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:6px;width:max-content}
.lv1{background:var(--ok-soft);color:var(--ok)}
.lv2{background:var(--warn-soft);color:var(--warn)}
.lv3{background:var(--err-soft);color:var(--err)}
.stars{letter-spacing:2px;color:var(--warn);font-variant-numeric:tabular-nums}
.lock{display:inline-flex;align-items:center;gap:4px;color:var(--warn);font-weight:700}
.ad{border:1px dashed var(--line);border-radius:var(--r);padding:12px;margin-bottom:24px;color:var(--muted);font-size:13px}
.foot{color:var(--muted);font-size:12px;padding-bottom:28px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:12px}

/* ---------- Chat ---------- */
.chat{height:100%;display:flex;flex-direction:column}
.bar{background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;max-width:760px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:inline-grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.bar .t{min-width:0;flex:1}
.bar .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-display);font-weight:600;font-size:16px}
.bar .t small{color:var(--muted);font-size:12px}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.msgs .wrap{max-width:760px;display:flex;flex-direction:column;gap:12px;padding-block:16px 24px}
.situ{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:14px}
.situ b{display:block;font-size:12px;color:var(--accent);letter-spacing:.04em;margin-bottom:2px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg.ai{align-self:flex-start}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.bub{border-radius:16px;padding:10px 14px;min-width:0;overflow-wrap:anywhere}
.ai .bub{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.me .bub{background:var(--bubble-me);color:var(--bubble-me-ink);border-bottom-right-radius:4px}
.bub .en{font-size:16px}
.bub .tr{color:var(--muted);font-size:13px;margin-top:4px}
.bub .acts{display:flex;gap:6px;margin-top:8px}
.mini{border:1px solid var(--line);background:transparent;border-radius:8px;padding:3px 9px;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.mini svg{width:14px;height:14px}
.typing{color:var(--muted);font-size:13px}
.fb{border-radius:var(--r);padding:14px 16px;border:1px solid;display:flex;flex-direction:column;gap:10px;font-size:14px}
.fb.perfect,.fb.good{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.fb.fix{background:var(--err-soft);border-color:color-mix(in srgb,var(--err) 35%,transparent)}
.fb.retry{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.fb .head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.fb.perfect .head,.fb.good .head{color:var(--ok)}
.fb.fix .head{color:var(--err)}
.fb.retry .head{color:var(--warn)}
.fb .score{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.fb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.fb li small{display:block;color:var(--muted)}
.fb .model{background:var(--surface);border-radius:10px;padding:10px 12px}
.fb .model small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.fb .model .en{font-size:15px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px}
.fb .btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.compose{background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.compose .wrap{max-width:760px;padding-block:10px;display:flex;flex-direction:column;gap:8px}
.mission{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;font-size:14px}
.mission p{margin:0;min-width:0}
.mission p b{color:var(--accent);font-size:12px;letter-spacing:.04em;display:block}
.mission .side{display:flex;gap:6px;flex:none}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inrow textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:46px;max-height:120px;font-size:16px}
.send{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mic.on{background:var(--err);border-color:var(--err);color:#fff}
.peek{font-size:13px;background:var(--accent-soft);border-radius:10px;padding:8px 12px}

/* ---------- Result ---------- */
.res{padding-block:24px 32px;max-width:760px;display:flex;flex-direction:column;gap:14px}
.big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--muted)}
.rline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.rline .q{color:var(--muted)}
.rline .row{display:flex;justify-content:space-between;gap:8px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;flex:none;font-variant-numeric:tabular-nums;align-self:flex-start;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-mid{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--err-soft);color:var(--err)}

/* ---------- Sheet / toast ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);background:color-mix(in srgb,#000 45%,transparent);display:grid;place-items:end center;z-index:50;padding:0 max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet .in{background:var(--surface);border-radius:18px;padding:20px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;margin-bottom:12px;max-height:88vh;overflow-y:auto}
.sheet select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:16px;max-width:100%}
.opt{display:flex;flex-direction:column;gap:6px;font-size:14px}
.pmeta{margin:0;color:var(--muted);font-size:13px}
.ptarget{margin:0;font-size:20px;line-height:1.9;display:flex;flex-wrap:wrap;gap:2px 6px}
.pw{border:0;background:none;padding:0 3px;border-radius:6px;font-size:inherit;color:var(--muted);border-bottom:2px solid transparent}
.pw.st{color:var(--ink);font-weight:700}
.pw.ok{border-bottom-color:var(--ok);background:var(--ok-soft)}
.pw.bad{border-bottom-color:var(--err);background:var(--err-soft);color:var(--err)}
.prow{display:flex;gap:6px;flex-wrap:wrap}
.ptips{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.ptips ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.ptips li span{font-weight:700;color:var(--accent)}
.pmic{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px}
.pmic svg{width:18px;height:18px}
.pmic.on{background:var(--err);border-color:var(--err);color:#fff}
.pheard{margin:0;font-size:14px;color:var(--muted)}
.sheet h2{margin:0;font-family:var(--f-display);font-size:22px}
.sheet input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.a2hs{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:center;z-index:55;box-shadow:0 6px 20px rgba(0,0,0,.15)}.a2hs[hidden]{display:none}.a2hs span{flex:1}.a2hs button{border:0;background:transparent;font-size:16px;padding:4px 8px;color:inherit}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;max-width:calc(100% - 32px);text-align:center}
@media (max-width:480px){.stats{gap:6px}.stat{padding:10px}.stat b{font-size:20px}.msg{max-width:94%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<div id="app"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="a2hs" class="a2hs" hidden><span>📲 아이폰에서 앱처럼 쓰기: 아래 <b>공유</b> 버튼 → <b>홈 화면에 추가</b></span><button type="button" id="a2hsX" aria-label="안내 닫기">✕</button></div>
<script>
/* =========================================================
   1) 설정 (수익화 옵션) — 여기만 바꾸면 됩니다
   ========================================================= */
const CONFIG = {
  // 유료로 잠글 레벨. 예) [3] → 고급만 유료, [2,3] → 중급+고급 유료, [] → 전부 무료
  premiumLevels: [],
  // 구매자에게 줄 잠금해제 코드 (대문자). 판매처에서 구매 후 안내 메시지로 전달하세요.
  unlockCodes: ["TALKSTEP-VIP"],
  // 결제 페이지 주소 (크몽·탈잉·스마트스토어·Gumroad 등 본인 판매 페이지)
  buyUrl: "",
  premiumPrice: "9,900원 (평생 이용)",
  // 홈/결과 화면 하단에 보여줄 광고·홍보 HTML (빈 칸이면 숨김)
  adHtml: ""
};

/* =========================================================
   2) 회화 콘텐츠 — T(상대 대사, 해석, 미션, [모범답안...], [[핵심표현, 뜻]...])
   핵심표현은 "a|b|c" 처럼 | 로 여러 표현을 허용합니다.
   ========================================================= */
function T(ai, aiKo, hint, answers, keys){ return {ai, aiKo, hint, answers, keys}; }
const CATS = {
  daily:{ko:"생활회화", en:"Daily Life"},
  business:{ko:"비즈니스", en:"Business"},
  travel:{ko:"여행회화", en:"Travel"}
};
const LEVELS = {1:"초급", 2:"중급", 3:"고급"};

const SCENARIOS = [
/* ---------- 생활 ---------- */
{id:"d1a", cat:"daily", lv:1, title:"Meeting a New Neighbor", ko:"새 이웃과 첫 인사", partner:"Emma",
 situ:"복도에서 옆집에 새로 이사 온 엠마(Emma)를 만났어요. 인사를 나눠 보세요.",
 turns:[
  T("Hi! I'm Emma. I just moved in next door.","안녕하세요! 저는 엠마예요. 옆집에 막 이사 왔어요.","만나서 반갑다고 인사하고 내 이름을 말해 보세요.",["Nice to meet you, Emma. I'm Minsu.","Hi Emma, nice to meet you. My name is Minsu."],[["nice to meet you|glad to meet you|pleasure to meet you|good to meet you","만나서 반가워요"]]),
  T("Where are you from?","어디에서 오셨어요?","한국에서 왔다고 말해 보세요.",["I'm from Korea.","I am from South Korea."],[["from","~에서 (from)"],["korea","한국"]]),
  T("Oh, cool! How long have you lived here?","오, 멋지네요! 여기 사신 지 얼마나 됐어요?","여기서 2년 살았다고 말해 보세요.",["I've lived here for two years.","For about two years."],[["two years","2년"]]),
  T("Do you know any good cafes around here?","이 근처에 괜찮은 카페 아세요?","모퉁이에 좋은 카페가 하나 있다고 알려 주세요.",["Yes, there's a nice cafe on the corner.","There is a good cafe on the corner."],[["cafe|coffee shop","카페"],["corner","모퉁이"]]),
  T("Thanks! Let's have coffee together sometime.","고마워요! 언제 같이 커피 마셔요.","좋다고 답해 보세요.",["Sure, that sounds great!","That sounds good. See you around!"],[["sound|sure|great|love to|good|okay|ok","좋아요"]])
 ]},
{id:"d1b", cat:"daily", lv:1, title:"Weekend Plans", ko:"친구와 주말 약속 잡기", partner:"Jake",
 situ:"친구 제이크(Jake)가 주말 계획을 물어봐요. 같이 영화 볼 약속을 잡아 보세요.",
 turns:[
  T("Hey! What are you doing this weekend?","안녕! 이번 주말에 뭐 해?","토요일에 영화 보러 갈 거라고 말해 보세요.",["I'm going to watch a movie on Saturday.","I'm going to see a movie on Saturday."],[["movie|film","영화"],["saturday","토요일"]]),
  T("Nice! What movie?","좋다! 무슨 영화?","액션 영화라고 말해 보세요.",["It's an action movie.","An action movie."],[["action","액션"]]),
  T("Can I come with you?","나도 같이 가도 돼?","물론이라고, 같이 가자고 말해 보세요.",["Of course! Let's go together.","Sure, let's go together."],[["of course|sure|yes|okay|ok","물론이지"],["together","같이"]]),
  T("What time should we meet?","몇 시에 만날까?","6시에 만나자고 제안해 보세요.",["Let's meet at six.","How about six o'clock?"],[["six","6시"]]),
  T("Great. Where should we meet?","좋아. 어디서 만날까?","극장 앞에서 만나자고 말해 보세요.",["Let's meet in front of the theater.","In front of the movie theater."],[["in front of","~앞에서"],["theater|theatre|cinema","극장"]])
 ]},
{id:"d2a", cat:"daily", lv:2, title:"At the Pharmacy", ko:"약국에서 증상 설명하기", partner:"Pharmacist",
 situ:"몸이 안 좋아서 약국에 왔어요. 약사에게 증상을 설명하고 약에 대해 물어보세요.",
 turns:[
  T("Hi, how can I help you today?","안녕하세요, 무엇을 도와드릴까요?","머리가 아프고 열이 있다고 말해 보세요.",["I have a headache and a fever.","I've got a headache and a fever."],[["headache","두통"],["fever","열"]]),
  T("I'm sorry to hear that. How long have you had these symptoms?","안타깝네요. 이런 증상이 언제부터 있었나요?","어제부터라고 말해 보세요.",["Since yesterday.","I've had them since yesterday."],[["since yesterday","어제부터"]]),
  T("Are you allergic to any medicine?","혹시 약 알레르기가 있으세요?","아니요, 알레르기는 없다고 말해 보세요.",["No, I'm not allergic to anything.","No, I don't have any allergies."],[["no|not","아니요"],["allerg","알레르기"]]),
  T("Okay. Take this twice a day after meals.","네. 이걸 하루 두 번 식후에 드세요.","이 약을 먹으면 졸린지 물어보세요.",["Will it make me sleepy?","Does it make me drowsy?"],[["sleepy|drowsy|tired","졸린"]]),
  T("It might. So don't drive after taking it.","그럴 수 있어요. 그러니 드시고 나서 운전은 하지 마세요.","알겠다고 하고 고맙다고 말해 보세요.",["Okay, I understand. Thank you.","Got it. Thanks for your help."],[["thank","감사합니다"]])
 ]},
{id:"d2b", cat:"daily", lv:2, title:"Asking a Friend for Help", ko:"친구에게 이사 도움 부탁하기", partner:"Olivia",
 situ:"이번 주말에 이사를 해요. 친구 올리비아(Olivia)에게 도움을 부탁해 보세요.",
 turns:[
  T("Hey, what's up? You look stressed.","무슨 일 있어? 스트레스 받아 보여.","이번 주말에 이사하는데 도와줄 수 있는지 물어보세요.",["I'm moving this weekend. Could you help me?","I'm moving this weekend. Can you help me out?"],[["moving|move","이사하다"],["help","돕다"]]),
  T("Sure, I'd be happy to help. What time?","물론이지, 기꺼이 도와줄게. 몇 시에?","토요일 아침 9시라고 말해 보세요.",["Saturday morning at nine.","At nine on Saturday morning."],[["saturday","토요일"],["nine","9시"]]),
  T("Do you need me to bring anything?","내가 뭐 가져갈 거 있어?","박스 몇 개 가져와 줄 수 있는지 물어보세요.",["Could you bring some boxes?","Can you bring a few boxes?"],[["bring","가져오다"],["box","박스"]]),
  T("No problem. Should I bring my car too?","문제없어. 내 차도 가져갈까?","그러면 정말 큰 도움이 될 거라고 말해 보세요.",["That would be really helpful.","That would help a lot."],[["would","~일 거야 (would)"],["help","도움"]]),
  T("Alright, see you on Saturday then!","좋아, 그럼 토요일에 봐!","정말 고맙다고, 점심은 내가 사겠다고 말해 보세요.",["Thanks so much. I'll buy you lunch!","Thank you so much. Lunch is on me!"],[["thank","고마워"],["lunch","점심"]])
 ]},
{id:"d3a", cat:"daily", lv:3, title:"A Polite Noise Complaint", ko:"이웃에게 소음 문제 정중히 말하기", partner:"Ryan",
 situ:"윗집 라이언(Ryan)의 음악 소리 때문에 잠을 못 자고 있어요. 기분 상하지 않게 정중히 이야기해 보세요.",
 turns:[
  T("Oh, hi. Is everything alright?","아, 안녕하세요. 무슨 일 있으세요?","방해해서 미안하지만 밤늦게 음악 소리가 꽤 크다고 정중히 말해 보세요.",["Sorry to bother you, but the music has been quite loud late at night.","I'm sorry to bother you, but your music is pretty loud late at night."],[["bother|disturb","방해하다"],["loud","시끄러운"]]),
  T("Oh no, I had no idea. I'm so sorry about that.","어머, 전혀 몰랐어요. 정말 죄송해요.","괜찮다고, 다만 일 때문에 아침 일찍 일어나야 한다고 설명해 보세요.",["That's okay. I just have to get up early for work.","No worries. It's just that I have to wake up early for work."],[["early","일찍"],["work","일/출근"]]),
  T("I totally understand. What time would be okay?","충분히 이해해요. 몇 시까지면 괜찮을까요?","밤 10시 이후에는 소리를 줄여 줄 수 있는지 부탁해 보세요.",["Would you mind turning it down after 10 p.m.?","It would be great if you could keep it down after ten."],[["after","~이후에"],["ten","10시"],["down|lower|quiet","줄이다"]]),
  T("Of course. I'll make sure to keep it down.","물론이죠. 꼭 소리 줄일게요.","이해해 줘서 정말 고맙다고 말해 보세요.",["I really appreciate your understanding.","Thanks a lot for understanding."],[["appreciate|thank","감사"],["understand","이해"]]),
  T("No problem at all. Let me know if anything else bothers you.","별말씀을요. 또 불편한 게 있으면 말씀해 주세요.","그러겠다고 하고 좋은 저녁 보내라고 인사해 보세요.",["I will. Have a good evening!","Will do. Have a nice evening!"],[["evening|night","저녁"]])
 ]},
{id:"d3b", cat:"daily", lv:3, title:"Debating Remote Work", ko:"재택근무에 대한 의견 나누기", partner:"Sophie",
 situ:"친구 소피(Sophie)와 재택근무의 장단점에 대해 이야기해요. 내 의견을 논리적으로 말해 보세요.",
 turns:[
  T("Do you think working from home is better than working at the office?","재택근무가 사무실 근무보다 낫다고 생각해?","장단점이 모두 있다고 생각한다고 말해 보세요.",["I think it has both pros and cons.","In my opinion, there are both advantages and disadvantages."],[["pros and cons|advantages|disadvantages|both","장단점"]]),
  T("What do you like most about it?","재택근무의 어떤 점이 제일 좋아?","출퇴근 시간을 아낄 수 있다는 점이라고 말해 보세요.",["I can save a lot of time on commuting.","Not having to commute saves me a lot of time."],[["commut","출퇴근"],["time","시간"]]),
  T("That's true. But don't you feel lonely sometimes?","맞아. 그래도 가끔 외롭지 않아?","맞다고, 가끔 동료들과 수다 떨던 게 그립다고 말해 보세요.",["Yes, I sometimes miss talking with my coworkers.","Actually, I do miss chatting with my colleagues sometimes."],[["miss","그리워하다"],["coworker|colleague","동료"]]),
  T("So what would be the ideal situation for you?","그럼 너한테 이상적인 방식은 뭐야?","일주일에 이틀 사무실에 가는 하이브리드가 이상적이라고 말해 보세요.",["A hybrid model would be ideal, like going to the office two days a week.","Ideally, I'd work from the office two days a week."],[["two days","이틀"],["week","일주일"]]),
  T("That sounds like the best of both worlds.","그거 양쪽의 장점만 모은 거네.","전적으로 동의한다고 말해 보세요.",["Exactly. I couldn't agree more.","I totally agree with you."],[["agree|exactly","동의 / 바로 그거야"]])
 ]},

{id:"b1a", cat:"business", lv:1, title:"First Day at Work", ko:"입사 첫날 동료와 인사", partner:"David",
 situ:"새 회사 첫 출근날이에요. 영업팀 동료 데이비드(David)가 말을 걸어요.",
 turns:[
  T("Hello, you must be the new team member. Welcome!","안녕하세요, 새로 오신 분이군요. 환영해요!","고맙다고 하고, 이름과 마케팅팀이라는 걸 말해 보세요.",["Thank you. I'm Jisu, and I'm on the marketing team.","Thanks! My name is Jisu. I joined the marketing team."],[["thank","감사합니다"],["marketing","마케팅"]]),
  T("Nice to meet you, Jisu. I'm David from sales.","반가워요, 지수 씨. 저는 영업팀 데이비드예요.","저도 만나서 반갑다고 말해 보세요.",["Nice to meet you too, David.","It's nice to meet you, too."],[["nice to meet you|pleasure|glad to meet you|good to meet you","만나서 반가워요"]]),
  T("Is this your first job?","여기가 첫 직장이에요?","아니라고, 전에 광고 회사에서 3년 일했다고 말해 보세요.",["No, I worked at an advertising company for three years.","No. I worked for an ad agency for three years before."],[["worked","일했다 (과거형)"],["three years","3년"]]),
  T("Great. If you have any questions, just ask me.","좋네요. 궁금한 거 있으면 언제든 물어보세요.","고맙다고 하고 회의실이 어디인지 물어보세요.",["Thanks. Where is the meeting room?","Thank you. Could you tell me where the meeting room is?"],[["where","어디"],["meeting room|conference room","회의실"]]),
  T("It's on the third floor, next to the elevator.","3층 엘리베이터 옆이에요.","알려 줘서 고맙다고 말해 보세요.",["Thank you for letting me know.","Thanks for telling me."],[["thank","감사합니다"]])
 ]},
{id:"b1b", cat:"business", lv:1, title:"Taking a Phone Message", ko:"전화 받고 메시지 남기기", partner:"Mr. Miller",
 situ:"팀장님(Ms. Park)을 찾는 전화가 왔는데 팀장님이 자리에 없어요. 대신 메시지를 받아 두세요.",
 turns:[
  T("Hello, may I speak to Ms. Park?","여보세요, 박 팀장님과 통화할 수 있을까요?","죄송하지만 지금 자리에 안 계신다고 말해 보세요.",["I'm sorry, she's not here right now.","Sorry, she is not at her desk at the moment."],[["not here|not in|not available|not at her desk|out","자리에 없다"]]),
  T("When will she be back?","언제 돌아오시나요?","오후 3시쯤 돌아오신다고 말해 보세요.",["She'll be back around three p.m.","She will be back at about three o'clock."],[["back","돌아오다"],["three","3시"]]),
  T("I see. Can I leave a message?","그렇군요. 메시지 남겨도 될까요?","물론이라고 하고 성함을 여쭤보세요.",["Sure. May I have your name, please?","Of course. Can I get your name?"],[["name","성함"]]),
  T("It's John Miller from ABC Company.","ABC 컴퍼니의 존 밀러입니다.","전화번호를 여쭤보세요.",["Could I have your phone number, please?","What's your phone number?"],[["number","번호"]]),
  T("It's 555-1234. Please ask her to call me back.","555-1234예요. 다시 전화 달라고 전해 주세요.","꼭 전해 드리겠다고 말해 보세요.",["I'll make sure she gets your message.","Sure, I'll tell her to call you back."],[["message|tell|call you back|let her know","전해 드리다"]])
 ]},
{id:"b2a", cat:"business", lv:2, title:"Scheduling a Meeting", ko:"회의 일정 잡기", partner:"Karen",
 situ:"거래처 담당자 캐런(Karen)과 새 프로젝트 회의 날짜를 정해야 해요.",
 turns:[
  T("Hi, I'd like to set up a meeting to discuss the new project.","안녕하세요, 새 프로젝트 논의를 위해 회의를 잡고 싶어요.","좋다고 하고 언제가 편한지 물어보세요.",["Sure. When would be convenient for you?","Of course. What time works for you?"],[["when|what time","언제"],["convenient|work|good","편한"]]),
  T("How about Tuesday afternoon?","화요일 오후 어떠세요?","화요일은 바쁘다고 하고 수요일 오전은 어떤지 제안해 보세요.",["I'm afraid I'm busy on Tuesday. How about Wednesday morning?","Tuesday doesn't work for me. Would Wednesday morning be okay?"],[["wednesday","수요일"],["morning","오전"]]),
  T("Wednesday at 10 works for me.","수요일 10시 좋아요.","좋다고 하고 회의실을 예약하겠다고 말해 보세요.",["Great. I'll book a meeting room.","Perfect. I will reserve a conference room."],[["book|reserve","예약하다"],["room","회의실"]]),
  T("Should I prepare anything for the meeting?","회의 전에 준비할 게 있을까요?","최근 판매 보고서를 가져와 달라고 부탁해 보세요.",["Could you bring the latest sales report?","Please bring the recent sales report."],[["sales report","판매 보고서"]]),
  T("Sure. I'll send you a calendar invite too.","네. 캘린더 초대도 보내 드릴게요.","고맙다고 하고 수요일에 보자고 말해 보세요.",["Thanks. See you on Wednesday.","Thank you. I'll see you on Wednesday."],[["wednesday","수요일"]])
 ]},
{id:"b2b", cat:"business", lv:2, title:"A Delayed Delivery Call", ko:"배송 지연 고객 응대", partner:"Customer",
 situ:"당신은 고객센터 직원이에요. 주문한 물건이 안 왔다는 고객 전화를 응대해 보세요.",
 turns:[
  T("Hi, I'm calling because our order hasn't arrived yet.","안녕하세요, 주문한 물건이 아직 안 와서 전화했어요.","불편을 드려 죄송하다고 하고 주문번호를 물어보세요.",["I'm sorry for the inconvenience. Could I have your order number?","I apologize for the inconvenience. May I have your order number, please?"],[["sorry|apologize","사과"],["order number","주문번호"]]),
  T("Sure, it's A-2045.","네, A-2045예요.","확인해 보겠다고 하고 잠시만 기다려 달라고 말해 보세요.",["Let me check that for you. One moment, please.","I'll check on that. Please hold on a moment."],[["check","확인하다"],["moment|second|minute|hold","잠시"]]),
  T("Okay, thank you.","네, 감사합니다.","날씨 때문에 배송이 지연되었다고 설명해 보세요.",["It looks like the delivery was delayed because of the weather.","Your shipment has been delayed due to bad weather."],[["delay","지연"],["weather","날씨"]]),
  T("I see. When can we expect it?","그렇군요. 언제쯤 받을 수 있을까요?","금요일까지는 도착할 거라고 말해 보세요.",["It should arrive by Friday.","You should receive it by Friday."],[["by friday","금요일까지"]]),
  T("Alright. Please let me know if there are any changes.","알겠어요. 변경 사항 있으면 알려 주세요.","물론이라고 하고 이메일로 업데이트를 보내겠다고 말해 보세요.",["Of course. I'll send you an update by email.","Certainly. I will email you with any updates."],[["email","이메일"],["update","업데이트"]])
 ]},
{id:"b3a", cat:"business", lv:3, title:"Negotiating a Price", ko:"가격 협상하기", partner:"Mr. Thompson",
 situ:"우리 회사 제품 견적을 받은 바이어 톰슨(Mr. Thompson)이 가격이 비싸다고 해요. 조건을 제시하며 협상해 보세요.",
 turns:[
  T("We've reviewed your proposal, but the price is higher than we expected.","제안서를 검토했는데, 가격이 예상보다 높네요.","이해한다고 하고, 우리 제품이 경쟁사보다 품질이 높다고 설명해 보세요.",["I understand. However, our product offers higher quality than our competitors'.","I see your point, but our product is of much higher quality."],[["quality","품질"]]),
  T("That may be true, but we have a limited budget this year.","그럴 수도 있지만 올해 예산이 한정돼 있어요.","대량 주문하면 10% 할인을 해 줄 수 있다고 제안해 보세요.",["If you place a large order, we can offer a ten percent discount.","We could give you a ten percent discount for a bulk order."],[["discount","할인"],["ten percent","10%"]]),
  T("How large would the order need to be?","주문량이 얼마나 돼야 하죠?","최소 500개라고 말해 보세요.",["At least five hundred units.","The minimum order would be five hundred units."],[["five hundred","500"],["unit|piece|item","개"]]),
  T("Hmm, could you include free shipping as well?","음, 무료 배송도 포함해 줄 수 있나요?","장기 계약을 맺는다면 고려해 보겠다고 말해 보세요.",["We could consider that if you sign a long-term contract.","If you agree to a long-term contract, we would be willing to consider it."],[["long-term|long term","장기"],["contract","계약"],["consider","고려하다"]]),
  T("That sounds reasonable. Let me discuss it with my team.","합리적이네요. 팀과 논의해 볼게요.","좋다고 하고, 이번 주말까지 답변을 기다리겠다고 말해 보세요.",["Sounds good. I look forward to hearing from you by the end of the week.","Great. I'll wait for your answer by the end of this week."],[["week|friday","이번 주 (말)까지"]])
 ]},
{id:"b3b", cat:"business", lv:3, title:"Presentation Q&A", ko:"발표 후 질의응답", partner:"Director Lee",
 situ:"분기 실적 발표를 마쳤어요. 이사님(Director Lee)의 날카로운 질문에 차분하게 답해 보세요.",
 turns:[
  T("Thank you for the presentation. Could you explain why sales dropped in the third quarter?","발표 감사합니다. 3분기에 매출이 떨어진 이유를 설명해 주시겠어요?","좋은 질문이라고 하고, 주로 원자재 비용 상승 때문이라고 답해 보세요.",["That's a good question. It was mainly due to rising material costs.","Good question. The main reason was the increase in raw material costs."],[["cost","비용"],["material","원자재"]]),
  T("And what steps are you taking to address that?","그 문제를 해결하려고 어떤 조치를 하고 있나요?","새 공급업체들과 협상 중이라고 답해 보세요.",["We're currently negotiating with new suppliers.","We are in negotiations with several new suppliers."],[["negotiat","협상"],["supplier","공급업체"]]),
  T("When do you expect to see results?","언제쯤 결과가 나올 것으로 보나요?","내년 1분기까지 개선될 것으로 기대한다고 답해 보세요.",["We expect to see improvements by the first quarter of next year.","We hope to see results by Q1 next year."],[["first quarter|q1","1분기"],["next year","내년"]]),
  T("Is there any risk that the plan might not work?","계획이 실패할 위험은 없나요?","위험은 항상 있지만 대안(백업 플랜)을 준비했다고 답해 보세요.",["There's always some risk, but we have a backup plan.","Of course there are risks, but we've prepared a backup plan."],[["risk","위험"],["backup plan|plan b|alternative","대안"]]),
  T("Thank you. That was very clear.","감사합니다. 아주 명확했어요.","질문 감사하다고 하고, 추가 질문은 이메일로 달라고 말해 보세요.",["Thank you for your question. Feel free to email me if you have any more questions.","Thanks for asking. Please email me if you have further questions."],[["email|contact","이메일 / 연락"]])
 ]},

/* =========================================================
   3) 교정 엔진 — 영어 문장을 분석해서 한국어로 설명
   ========================================================= */
const NUMS = {"1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve","15":"fifteen","20":"twenty","23":"twenty three","24":"twenty four","100":"one hundred","500":"five hundred"};
function norm(s){
  s = String(s).toLowerCase().replace(/[’‘`]/g,"'");
  s = s.replace(/\b([ap])\.\s?m\.?/g,"$1m");
  s = s.replace(/(\d+)\s*%/g,"$1 percent");
  s = s.replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not")
       .replace(/\blet's\b/g,"let us").replace(/n't\b/g," not").replace(/'m\b/g," am").replace(/'re\b/g," are")
       .replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'d\b/g," would")
       .replace(/\b(he|she|it|that|there|what|where|who|how|here|this)'s\b/g,"$1 is");
  s = s.replace(/\b\d+\b/g, m => NUMS[m] || m);
  s = s.replace(/-/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
  return s;
}
const ING_OK = new Set(["bring","sting","swing","spring","string","cling","fling","sling","wring"]);
const AUX_BEFORE = new Set(["does","did","do","can","could","will","would","should","must","may","might","let","make","makes","made","help","helps","not"]);
const prevWord = (n, idx) => { const b = n.slice(0, idx).trim().split(" "); return b[b.length-1] || ""; };
const NUMW = "(?:one|two|three|four|five|six|seven|eight|nine|ten|a few|several|many)";
const DAYS = "(?:monday|tuesday|wednesday|thursday|friday|saturday|sunday)";

// 각 규칙: re(정규식), msg(설명), ex(예시) / check(추가 조건) / exf(예시를 매치에 맞춰 생성)
const RULES = [
 {re:/\b(?:am|is|are|was|were) (go|want|need|know|think|agree|live|come|feel|understand|have|like to)\b/, msg:"be동사(am/is/are) 바로 뒤에 일반동사 원형을 함께 쓰지 않아요.", ex:"I am agree → I agree / I am go → I go 또는 I am going"},
 {re:/\b(?:want|wants|wanted|need|needs|would like|like|likes|hope|plan|decide|decided|try|tried) to (\w{5,}ing)\b/, check:m=>!ING_OK.has(m[1]), msg:"to 뒤에는 -ing가 아니라 동사원형이 와요.", ex:"I want to going → I want to go"},
 {re:/\b(?:can|could|will|would|should|must|may|might) to\b/, msg:"조동사(can, will, should 등) 바로 뒤에는 to를 쓰지 않아요.", ex:"I can to help → I can help"},
 {re:/\b(?:can|could|will|would|should|must|may|might|do not|does not|did not|did|does|to|let us) (goes|wants|has|needs|likes|makes|takes|comes|works|went|came|took|bought|ate|saw|made|gave|wanted|liked|needed|worked|arrived|called|helped|was|were|is|are|am)\b/, msg:"조동사·do/does/did·to 뒤에는 동사원형(기본형)을 써요.", ex:"I did not went → I did not go / She can goes → She can go / will is → will be"},
 {re:/\bi (?:is|are|has)\b/, msg:"주어가 I일 때는 am, have를 써요.", ex:"I is → I am / I has → I have"},
 {re:/\b(?:he|she|it) (are|have|do not|want|need|like|go|work|live|know|make|take|come|look|seem|sound|arrive)\b/, check:(m,n)=>!AUX_BEFORE.has(prevWord(n,m.index)), msg:"he/she/it(3인칭 단수) 주어 뒤 현재형 동사에는 -s를 붙이고, be동사는 is, have는 has, do는 does를 써요.", ex:"She have a meeting → She has a meeting / It sound great → It sounds great"},
 {re:/\b(?:you|we|they) (?:is|has|was)\b/, check:(m,n)=>!AUX_BEFORE.has(prevWord(n,m.index)), msg:"you/we/they 주어에는 are, have, were를 써요.", ex:"They is → They are / We has → We have"},
 {re:/\ba ([aeiou][a-z]*)\b/, check:m=>!/^(uni|use|usu|uti|eu|one|once|ur)/.test(m[1]), msg:"모음 소리(a, e, i, o, u)로 시작하는 단어 앞에는 a 대신 an을 써요.", exf:m=>`a ${m[1]} → an ${m[1]}`},
 {re:/\ban ([b-df-hj-np-tv-z][a-z]*)\b/, check:m=>!/^(hour|honest|hono|heir|herb)/.test(m[1]), msg:"자음 소리로 시작하는 단어 앞에는 an 대신 a를 써요.", exf:m=>`an ${m[1]} → a ${m[1]}`},
 {re:/\b(?:want|wants|need|needs|decide|decided|plan|hope|would like) (go|eat|buy|see|meet|do|make|take|get|come|visit|try|watch|check|book|ask|know|have|bring|leave|pay|change|help)\b/, msg:"want / need / would like 뒤에 동사가 올 때는 to를 붙여요.", ex:"I want go → I want to go / I'd like have → I'd like to have"},
 {re:/\bdiscuss(?:ed|ing)? about\b/, msg:"discuss는 about 없이 바로 목적어를 써요.", ex:"discuss about the plan → discuss the plan"},
 {re:/\bexplain(?:ed)? (?:me|us|him|her)\b/, msg:"explain 뒤에 사람이 올 때는 to를 붙여요.", ex:"explain me → explain to me"},
 {re:/\bmarried with\b/, msg:"'~와 결혼했다'는 married to를 써요.", ex:"married with him → married to him"},
 {re:/\bcontact(?:ed)? (?:to|with) (?:me|you|us|him|her|them)\b/, msg:"contact는 전치사 없이 바로 사람을 써요.", ex:"contact to me → contact me"},
 {re:/\breply(?:ied)? (?:me|you|us|him|her|them)\b/, msg:"reply 뒤에는 to를 붙여요.", ex:"reply me → reply to me"},
 {re:/\barriv(?:e|ed|es|ing) to\b/, msg:"arrive는 to가 아니라 at(좁은 장소)이나 in(도시·나라)과 함께 써요.", ex:"arrive to the hotel → arrive at the hotel"},
 {re:/\blisten(?:ed|ing|s)? (?:music|me|him|her|this|the|it)\b/, msg:"listen 뒤에는 to를 붙여요.", ex:"listen music → listen to music"},
 {re:/\b(?:go|goes|going|went|come|came|get|got) to home\b/, msg:"home 앞에는 to를 쓰지 않아요.", ex:"go to home → go home"},
 {re:/\bi very (?:like|want|love|enjoy)\b/, msg:"'정말 좋아해요'는 very가 아니라 really를 써요.", ex:"I very like it → I really like it"},
 {re:/\bvery thank\b/, msg:"'정말 감사해요'는 Thank you very much 순서로 써요.", ex:"very thank you → thank you very much"},
 {re:/\bhow about to\b/, msg:"How about 뒤에는 동사-ing나 명사가 와요.", ex:"How about to meet at six? → How about meeting at six?"},
 {re:/\blook(?:ing)? forward to (see|meet|hear|work|talk|visit)\b/, msg:"look forward to의 to는 전치사라서 뒤에 -ing가 와요.", exf:m=>`look forward to ${m[1]} → look forward to ${m[1]}ing`},
 {re:new RegExp(`\\bsince ${NUMW} (?:year|month|week|day|hour|minute)s?\\b`), msg:"'~동안'(기간)은 for, '~부터'(시작 시점)는 since를 써요.", ex:"since two years → for two years / since 2020 (O)"},
 {re:new RegExp(`\\bduring ${NUMW} (?:year|month|week|day|hour|minute)s?\\b`), msg:"숫자로 된 기간 앞에는 during 대신 for를 써요.", ex:"during three years → for three years"},
 {re:new RegExp(`\\b(?:in|at) ${DAYS}s?\\b`), msg:"요일 앞에는 on을 써요.", ex:"in Saturday → on Saturday"},
 {re:/\bat (?:the )?(?:morning|afternoon|evening)\b/, msg:"아침·오후·저녁 앞에는 in the를 써요. (밤은 at night)", ex:"at morning → in the morning"},
 {re:/\b(?:on|in|at) (?:tomorrow|yesterday|next (?:week|month|year)|last (?:week|month|year|night))\b/, msg:"tomorrow, yesterday, next week 같은 시간 표현 앞에는 전치사를 쓰지 않아요.", ex:"see you on tomorrow → see you tomorrow"},
 {re:/\bi am (interesting|exciting|boring|tiring|confusing|surprising)\b/, msg:"내 감정을 말할 때는 -ing가 아니라 -ed를 써요. (-ing는 '남을 그렇게 만드는')", exf:m=>`I am ${m[1]} → I am ${m[1].replace(/ing$/,"ed")}`},
 {re:/\bmore (better|worse|bigger|faster|easier|cheaper|smaller|larger)\b/, msg:"이미 비교급(-er)이라서 more를 함께 쓰지 않아요.", exf:m=>`more ${m[1]} → ${m[1]}`},
 {re:/\blet us to\b/, msg:"Let's 뒤에는 to 없이 동사원형을 써요.", ex:"Let's to go → Let's go"},
 {re:/\blet us (\w{5,}ing)\b/, check:m=>!ING_OK.has(m[1]), msg:"Let's 뒤에는 동사원형을 써요.", ex:"Let's going → Let's go"},

 {re:/\bi have (?:\w+ )?(?:\w+ )?years old\b/, msg:"나이는 have가 아니라 be동사로 말해요.", ex:"I have 30 years old → I am 30 years old"}

function lcs(a, b){
  const dp = Array(b.length+1).fill(0);
  for (let i=1;i<=a.length;i++){ let prev=0;
    for (let j=1;j<=b.length;j++){ const t=dp[j]; dp[j] = a[i-1]===b[j-1] ? prev+1 : Math.max(dp[j], dp[j-1]); prev=t; } }
  return dp[b.length];
}
function keyHit(n, key){
  const pad = " " + n + " ";
  return key.split("|").some(alt => { const k = norm(alt); return k && new RegExp("\\s" + k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(pad); });
}
function evaluate(raw, turn){
  const res = {errors:[], tips:[], missing:[], best:turn.answers[0], sim:0, status:"retry", score:30};
  const text = raw.trim();
  if (/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(text)){
    res.errors.push({msg:"한글이 섞여 있어요. 영어로만 입력해 주세요.", ex:"모르는 단어는 '모범답안 보기'로 확인해 보세요."});
    res.status="fix"; res.score=0; return res;
  }
  const n = norm(text);
  const words = n ? n.split(" ") : [];
  if (!words.length){ res.status="retry"; res.score=0; return res; }
  for (const r of RULES){
    const m = r.re.exec(n);
    if (m && (!r.check || r.check(m, n))) res.errors.push({msg:r.msg, ex:r.exf ? r.exf(m) : r.ex});
  }
  // 유사도: 모범답안 중 가장 가까운 것
  for (const a of turn.answers){
    const aw = norm(a).split(" ");
    const s = 2*lcs(words, aw)/(words.length + aw.length);
    if (s > res.sim){ res.sim = s; res.best = a; }
  }
  for (const [k, ko] of turn.keys) if (!keyHit(n, k)) res.missing.push({k:k.split("|")[0], ko});
  // 사소한 팁 (점수에 영향 없음)
  if (/(^|\s)i(\s|'|$)/.test(text)) res.tips.push("'I(나)'는 문장 어디에 있든 항상 대문자로 써요.");
  if (/\?\s*$/.test(res.best) && !/\?\s*$/.test(text)) res.tips.push("질문하는 문장이니 끝에 물음표(?)를 붙여 주세요.");
  if (res.errors.length){ res.status="fix"; res.score=50; }
  else if (res.sim >= 0.95){ res.status="perfect"; res.score=100; }
  else if (!res.missing.length || res.sim >= 0.75){ res.status="good"; res.score=Math.min(99, 80 + Math.round(res.sim*20)); }
  else { res.status="retry"; res.score = Math.round(20 + res.sim*30); }
  return res;
}

function listen(btn, opts){
  if (listening){ listening.stop(); return; }
  try { if (V.tts) V.tts.stop().catch(()=>{}); speechSynthesis.cancel(); } catch(e){}

    const d = V.dict; let fin = "", timer = null; const unsubs = [];
    const done = () => { unsubs.forEach(u => { try{u();}catch(e){} }); clearTimeout(timer); finish(fin, [fin]); };
    unsubs.push(d.onPartial(({text}) => { clearTimeout(timer); onText((fin + " " + text).trim()); }));
    unsubs.push(d.onFinal(({text}) => { fin = (fin + " " + text).trim(); onText(fin);
      if (opts.autoStop){ clearTimeout(timer); timer = setTimeout(() => d.stop().catch(()=>{}), 1300); } }));
    unsubs.push(d.onState(({state, reason}) => { if (state === "idle"){ if (reason) micError(reason); done(); } }));

  if (!SR) return toast("이 브라우저는 음성 입력을 지원하지 않아요. 크롬(PC·안드로이드)이나 사파리(아이폰)를 써 주세요.");
  try {
    const r = new SR(); r.lang = "en-US"; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
    let best = "", alts = [];
    r.onresult = e => {
      best = Array.from(e.results).map(x => x[0].transcript).join(" ");
      const last = e.results[e.results.length-1];
      if (last.isFinal){ const head = Array.from(e.results).slice(0,-1).map(x => x[0].transcript).join(" ");

  } catch(e){ btn.classList.remove("on"); listening = null; toast(IS_IOS && IS_STANDALONE ? IOS_HOME_MIC_MSG : "음성 입력을 시작할 수 없어요.", IS_IOS && IS_STANDALONE ? 6000 : undefined); }
}

function openPron(target, onScore){
  const toks = target.split(/\s+/).filter(Boolean);
  const tips = nativeTips(target);
  sheet(`<h2>발음 코치</h2>
    <p class="pmeta">원어민 음성을 듣고 → 마이크를 눌러 똑같이 따라 말해 보세요. <b>굵은 단어</b>는 강하게, 나머지는 약하고 빠르게 말하면 원어민 리듬이 돼요. 단어를 누르면 그 단어만 천천히 들려줘요.</p>
    <p class="ptarget" id="pt">${toks.map((t,i) => `<button class="pw${FUNC.has(tokClean(t)) ? "" : " st"}" data-i="${i}">${esc(t)}</button>`).join(" ")}</p>
    <div class="prow">${SPEEDS.map(([r,l]) => `<button class="mini" data-r="${r}">${ICON.spk} ${l}</button>`).join("")}</div>
    ${tips.length ? `<div class="ptips"><b>원어민처럼 말하는 팁</b><ul>${tips.map(x => `<li><span>${esc(x.h)}</span> ${esc(x.t)}</li>`).join("")}</ul></div>` : ""}
    <button class="btn pri pmic" id="pmic">${ICON.mic} 눌러서 따라 말하기</button>
    <p class="pheard" id="ph" hidden></p>
    <div id="pres"></div>
    <div style="display:flex;justify-content:flex-end"><button class="btn" id="pcx">닫기</button></div>`);
  const sh = document.getElementById("sheet");
  sh.querySelectorAll("[data-r]").forEach(b => b.onclick = () => speak(target, +b.dataset.r));
  sh.querySelectorAll(".pw").forEach(b => b.onclick = () => speak(b.textContent.replace(/[^A-Za-z' -]/g,""), 0.7));
  document.getElementById("pcx").onclick = () => { if (listening) listening.stop(); closeSheet(); };
  const mic = document.getElementById("pmic"), ph = document.getElementById("ph");
  mic.onclick = () => {
    const wasOn = !!listening;
    listen(mic, {autoStop:true,
      onText: t => { ph.hidden = false; ph.textContent = "들린 문장: " + t; },
      onDone: (text, alts) => {
        if (!text) return;
        const r = scorePron(target, alts.length ? alts : [text]);
        ph.hidden = false; ph.textContent = "들린 문장: " + r.heard;
        sh.querySelectorAll(".pw").forEach((b,i) => { b.classList.toggle("ok", r.ok[i]); b.classList.toggle("bad", !r.ok[i]); });
        const missed = toks.filter((_,i) => !r.ok[i]);
        const wt = wordTips(missed);
        const grade = r.score >= 90 ? "원어민이 바로 알아듣는 발음이에요!" : r.score >= 70 ? "좋아요! 빨간 단어만 다시 연습해 보세요." : "천천히 듣기로 한 단어씩 따라 한 뒤 다시 도전해 보세요.";
        document.getElementById("pres").innerHTML = `<div class="fb ${r.score>=90?"perfect":r.score>=70?"retry":"fix"}"><div class="head"><span>${grade}</span><span class="score">${r.score}점</span></div>
          ${missed.length ? `<div>잘 안 들린 단어: ${missed.map(w => `<b>${esc(w)}</b>`).join(", ")}</div>` : ""}
          ${wt.length ? `<ul>${wt.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div>`;
        mic.innerHTML = `${ICON.mic} 다시 따라 말하기`;
        if (onScore) onScore(r.score);
      }});
    if (!wasOn && listening) mic.innerHTML = `${ICON.mic} 듣는 중… (끝나면 다시 눌러 멈추기)`;
  };
  speak(target);
}

function stopVoice(){ try { if (V.tts) V.tts.stop().catch(()=>{}); speechSynthesis.cancel(); } catch(e){} if (listening) listening.stop(); }
function openScenario(id){
  const s = SCENARIOS.find(x=>x.id===id);
  if (isLocked(s)) return showPremium();
  run = {s, i:0, results:s.turns.map(()=>({score:0, answer:"", tried:false})), peeked:false, waiting:false};
  touchStreak();
  renderChat();
  addSitu();
  setTimeout(()=>addAi(), 350);
}

function showVoiceOpts(){

    : vs.length ? `<select id="o3"><option value="">자동 (가장 자연스러운 음성)</option>${vs.map((v,i) => `<option value="${esc(v.name)}" ${DB.settings.voice===v.name?"selected":""}>${esc(v.name)}${i===0?" · 추천":""}</option>`).join("")}</select>`

const list = () => document.getElementById("list");
function scrollEnd(){ const m = document.getElementById("msgs"); if (m) m.scrollTop = m.scrollHeight; }
function addHtml(html){ const d = document.createElement("div"); d.innerHTML = html; const el = d.firstElementChild; list().appendChild(el); scrollEnd(); return el; }
function addSitu(){ addHtml(`<div class="situ"><b>상황</b>${esc(run.s.situ)}</div>`); }
function updateTop(){
  const s = run.s, i = run.i, t = s.turns[i];
  document.getElementById("cnt").textContent = `${Math.min(i+1, s.turns.length)} / ${s.turns.length}`;
  document.getElementById("pbar").style.width = (i / s.turns.length * 100) + "%";
  document.getElementById("mis").textContent = t ? t.hint : "";
  const pb = document.getElementById("peekbox"); pb.hidden = true; run.peeked = false;
}
function addAi(){
  const t = run.s.turns[run.i];
  updateTop();
  const el = addHtml(`<div class="msg ai"><span class="av" aria-hidden="true">${esc(run.s.partner[0])}</span><div class="bub">
    <div class="en">${esc(t.ai)}</div><div class="tr" hidden>${esc(t.aiKo)}</div>
    <div class="acts"><button class="mini" data-a="spk">${ICON.spk} 듣기</button><button class="mini" data-a="tr">해석</button><button class="mini" data-a="pr">${ICON.mic} 따라 말하기</button></div></div></div>`);
  el.querySelector('[data-a="pr"]').onclick = () => openPron(t.ai);
  el.querySelector('[data-a="spk"]').onclick = () => speak(t.ai);
  el.querySelector('[data-a="tr"]').onclick = e => { const tr = el.querySelector(".tr"); tr.hidden = !tr.hidden; e.currentTarget.textContent = tr.hidden ? "해석" : "해석 숨기기"; };
  if (DB.settings.auto) speak(t.ai);
  run.waiting = false;
  const ta = document.getElementById("ta"); ta.disabled = false; if (matchMedia("(pointer:fine)").matches) ta.focus();
}
function peek(){
  const t = run.s.turns[run.i]; if (!t) return;
  const pb = document.getElementById("peekbox");
  pb.innerHTML = `<b>모범답안:</b> ${esc(t.answers[0])}${t.answers[1] ? `<br><span style="color:var(--muted)">또는 ${esc(t.answers[1])}</span>` : ""}<br><span style="color:var(--muted);font-size:12px">답안을 본 뒤에는 이 턴의 최고 점수가 70점으로 제한돼요.</span>`;
  pb.hidden = false; run.peeked = true; scrollEnd();
}
function markModel(model, userNorm){
  const have = new Set(userNorm.split(" "));
  return model.split(/(\s+)/).map(tok => {
    if (/^\s+$/.test(tok)) return tok;
    const parts = norm(tok).split(" ").filter(Boolean);
    const miss = parts.length && parts.some(p => !have.has(p));
    return miss ? `<mark>${esc(tok)}</mark>` : esc(tok);
  }).join("");
}
function submit(){
  if (run.waiting || run.i >= run.s.turns.length) return;
  const ta = document.getElementById("ta"); const raw = ta.value.trim();
  if (!raw) return toast("영어로 답을 입력하거나 마이크로 말해 주세요.");
  if (listening) listening.stop();
  const t = run.s.turns[run.i];
  addHtml(`<div class="msg me"><div class="bub"><div class="en">${esc(raw)}</div></div></div>`);
  ta.value = ""; ta.style.height = "auto";
  const r = evaluate(raw, t);
  let score = r.score; if (run.peeked) score = Math.min(score, 70);
  const cur = run.results[run.i];
  if (!cur.tried || score > cur.score){ cur.score = score; cur.answer = raw; }
  cur.tried = true;
  const head = {perfect:"완벽해요!", good:"잘했어요! 뜻이 잘 전달됐어요", fix:"틀린 부분이 있어요", retry:"조금 더 해 볼까요?"}[r.status];
  let body = "";
  if (r.errors.length) body += `<ul>${r.errors.map(e=>`<li>${esc(e.msg)}<small>${esc(e.ex)}</small></li>`).join("")}</ul>`;
  if ((r.status === "retry" || r.status === "fix") && r.missing.length) body += `<ul>${r.missing.map(m=>`<li>핵심 표현이 빠졌어요: <b>${esc(m.k)}</b> (${esc(m.ko)})</li>`).join("")}</ul>`;
  if (r.tips.length) body += `<ul>${r.tips.map(x=>`<li><small style="color:inherit">${esc(x)}</small></li>`).join("")}</ul>`;
  const n = norm(raw);
  const modelLabel = r.status === "perfect" ? "모범답안과 같아요" : r.status === "good" ? "이렇게 말하면 더 자연스러워요 (노란색: 내 답에 없던 단어)" : "이렇게 말해 보세요 (노란색: 내 답에 없던 단어)";
  const el = addHtml(`<div class="fb ${r.status}">
    <div class="head"><span>${head}</span><span class="score">${score}점</span></div>
    ${body}
    <div class="model"><small>${modelLabel}</small><div class="en">${r.status==="perfect" ? esc(r.best) : markModel(r.best, n)}</div>
      <div class="acts" style="margin-top:6px"><button class="mini" data-a="spk">${ICON.spk} 발음 듣기</button><button class="mini" data-a="pr">${ICON.mic} 발음 연습</button></div></div>
    <div class="btns">${r.status==="perfect"||r.status==="good" ? `<button class="btn pri" data-a="next">다음 대화로</button><button class="btn" data-a="again">다시 말해 보기</button>` : `<button class="btn pri" data-a="again">다시 말해 보기</button><button class="btn" data-a="next">다음으로 넘어가기</button>`}</div>
  </div>`);
  el.querySelector('[data-a="spk"]').onclick = () => speak(r.best);
  el.querySelector('[data-a="pr"]').onclick = () => openPron(r.best, sc => { cur.pron = Math.max(cur.pron || 0, sc); });
  el.querySelector('[data-a="again"]').onclick = () => { ta.focus(); };
  el.querySelector('[data-a="next"]').onclick = e => { e.currentTarget.disabled = true; nextTurn(); };
}
function nextTurn(){
  if (run.waiting) return;
  run.waiting = true;
  run.i++;
  document.getElementById("ta").disabled = true;
  if (run.i >= run.s.turns.length){ document.getElementById("pbar").style.width = "100%"; setTimeout(finish, 400); return; }
  const typing = addHtml(`<div class="typing">${esc(run.s.partner)} 님이 말하는 중…</div>`);
  setTimeout(()=>{ typing.remove(); addAi(); }, 650);
}
function finish(){
  stopVoice();
  const s = run.s;
  const total = Math.round(run.results.reduce((a,r)=>a+r.score,0) / s.turns.length);
  const prev = DB.scores[s.id];
  if (prev == null || total > prev){ DB.scores[s.id] = total; save(); }
  const idx = SCENARIOS.indexOf(s);
  const nxt = SCENARIOS.slice(idx+1).concat(SCENARIOS.slice(0, idx)).find(x => !isLocked(x) && DB.scores[x.id] == null);
  const pill = sc => `<span class="pill ${sc>=80?"p-ok":sc>=50?"p-mid":"p-bad"}">${sc}점</span>`;
  $app.innerHTML = `<div class="scroll"><div class="wrap res">
    <span class="lv lv${s.lv}">${CATS[s.cat].ko} · ${LEVELS[s.lv]}</span>
    <h2 class="brand" style="font-size:28px">${esc(s.title)}</h2>
    <div class="big">${total}<small>점</small> <span class="stars" style="font-size:24px">${stars(total)}</span></div>
    <p style="margin:0;color:var(--muted)">${total>=90?"훌륭해요! 다음 단계로 넘어가도 좋아요.":total>=70?"좋아요! 노란색으로 표시된 표현을 한 번 더 연습해 보세요.":"괜찮아요. 모범답안을 소리 내어 따라 읽고 다시 도전해 보세요."}${prev!=null?` (이전 최고 ${prev}점)`:""}</p>
    <p style="margin:0;color:var(--muted);font-size:13px">${run.results.some(r=>r.pron!=null) ? `발음 연습 평균 ${Math.round(run.results.filter(r=>r.pron!=null).reduce((a,r)=>a+r.pron,0)/run.results.filter(r=>r.pron!=null).length)}점` : "피드백 카드의 ‘발음 연습’으로 모범답안을 원어민처럼 따라 말해 보세요."}</p>
    ${s.turns.map((t,i)=>`<div class="rline">
      <div class="row"><span class="q">${esc(s.partner)}: ${esc(t.ai)}</span><span style="display:flex;gap:4px;flex:none">${pill(run.results[i].score)}${run.results[i].pron!=null?`<span class="pill ${run.results[i].pron>=90?"p-ok":run.results[i].pron>=70?"p-mid":"p-bad"}">발음 ${run.results[i].pron}</span>`:""}</span></div>
      <div>나: ${run.results[i].answer ? esc(run.results[i].answer) : `<span style="color:var(--muted)">(건너뜀)</span>`}</div>
      <div style="color:var(--ok)">모범: ${esc(t.answers[0])}</div></div>`).join("")}
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn pri" id="again">다시 도전</button>
      ${nxt ? `<button class="btn" id="nxt">다음 대화: ${esc(nxt.ko)}</button>` : ""}
      <button class="btn" id="home">목록으로</button>
    </div>
    ${AD_HTML ? `<div class="ad">${AD_HTML}</div>` : ""}
  </div></div>`;
  document.getElementById("again").onclick = () => openScenario(s.id);
  document.getElementById("home").onclick = renderHome;
  if (nxt) document.getElementById("nxt").onclick = () => openScenario(nxt.id);
}

try { speechSynthesis.getVoices(); speechSynthesis.onvoiceschanged = () => speechSynthesis.getVoices(); } catch(e){}
// 아이폰 사파리는 화면을 처음 터치할 때 음성을 "깨워" 둬야 이후 자동 읽기가 소리 납니다.
(function unlockSpeech(){
  const go = () => { try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch(e){}
    document.removeEventListener("touchend", go, true); document.removeEventListener("click", go, true); };
  document.addEventListener("touchend", go, true); document.addEventListener("click", go, true);
})();
renderHome();
// 아이폰 사파리(홈 화면 앱이 아닐 때)에서만 '홈 화면에 추가' 안내를 한 번 보여 줍니다.
(function homeHint(){ try {
  if (!IS_IOS || IS_STANDALONE || IS_NATIVE_APP || localStorage.getItem(STORE_KEY + ".a2hs")) return;
  const el = document.getElementById("a2hs"); el.hidden = false;
  document.getElementById("a2hsX").onclick = () => { el.hidden = true; try { localStorage.setItem(STORE_KEY + ".a2hs", "1"); } catch(e){} };
  document.addEventListener("click", e => { if (!el.contains(e.target)) el.hidden = true; }, true);
} catch(e){} })();
</script>
