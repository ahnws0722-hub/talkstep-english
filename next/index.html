const list = () => document.getElementById("list");
function scrollEnd(){ const m = document.getElementById("msgs"); if (m) m.scrollTop = m.scrollHeight; }
function addHtml(html){ const d = document.createElement("div"); d.innerHTML = html; const el = d.firstElementChild; list().appendChild(el); scrollEnd(); return el; }
function addSitu(){ addHtml(`<div class="situ"><b>상황</b>${esc(run.s.situ)}</div>`); }
function updateTop(){
  const s = run.s, i = run.i, t = s.turns[i];
  document.getElementById("cnt").textContent = `${Math.min(i+1, s.turns.length)} / ${s.turns.length}`;
  document.getElementById("pbar").style.width = (i / s.turns.length * 100) + "%";
  document.getElementById("mis").textContent = t ? t.hint : "";
  const pb = document.getElementById("peekbox"); pb.hidden = true; run.peeked = false;
}
function addAi(){
  const t = run.s.turns[run.i];
  updateTop();
  const el = addHtml(`<div class="msg ai"><span class="av" aria-hidden="true">${esc(run.s.partner[0])}</span><div class="bub">
    ${card4(t.ai, t.aiKo, DB.settings.show4 === false)}
    <div class="acts"><button class="mini" data-a="spk">${ICON.spk} 영어 듣기</button><button class="mini" data-a="pr">${ICON.mic} 따라 말하기</button><button class="mini" data-a="fold">${DB.settings.show4 === false ? "4개국어 펼치기" : "4개국어 접기"}</button></div></div></div>`);
  el.querySelector('[data-a="pr"]').onclick = () => openPron(t.ai);
  el.querySelector('[data-a="spk"]').onclick = () => speak(t.ai);
  el.querySelector('[data-a="fold"]').onclick = e => { const c = el.querySelector(".c4"); c.classList.toggle("fold"); const f = c.classList.contains("fold");
    DB.settings.show4 = !f; save(); e.currentTarget.textContent = f ? "4개국어 펼치기" : "4개국어 접기"; };
  if (DB.settings.auto){
    if (DB.settings.auto4 && LANG4[t.ai] && !el.querySelector(".c4").classList.contains("fold")) playLines([...el.querySelectorAll(".l4")].map(itemOf), el.querySelector("[data-play4]"));
    else speak(t.ai);
  }
  run.waiting = false;
  const ta = document.getElementById("ta"); ta.disabled = false; if (matchMedia("(pointer:fine)").matches) ta.focus();
}
function peek(){
  const t = run.s.turns[run.i]; if (!t) return;
  const pb = document.getElementById("peekbox");
  pb.innerHTML = `<b>모범답안:</b> ${esc(t.answers[0])}${t.answers[1] ? `<br><span style="color:var(--muted)">또는 ${esc(t.answers[1])}</span>` : ""}<br><span style="color:var(--muted);font-size:12px">답안을 본 뒤에는 이 턴의 최고 점수가 70점으로 제한돼요.</span>`;
  pb.hidden = false; run.peeked = true; scrollEnd();
}
function markModel(model, userNorm){
  const have = new Set(userNorm.split(" "));
  return model.split(/(\s+)/).map(tok => {
    if (/^\s+$/.test(tok)) return tok;
    const parts = norm(tok).split(" ").filter(Boolean);
    const miss = parts.length && parts.some(p => !have.has(p));
    return miss ? `<mark>${esc(tok)}</mark>` : esc(tok);
  }).join("");
}
function submit(){
  if (run.waiting || run.i >= run.s.turns.length) return;
  const ta = document.getElementById("ta"); const raw = ta.value.trim();
  if (!raw) return toast("영어로 답을 입력하거나 마이크로 말해 주세요.");
  run.sub = (run.sub || 0) + 1;
  if (listening) listening.stop();
  const t = run.s.turns[run.i];
  addHtml(`<div class="msg me"><div class="bub"><div class="en">${esc(raw)}</div></div></div>`);
  ta.value = ""; ta.style.height = "auto";
  const r = evaluate(raw, t);
  let score = r.score; if (run.peeked) score = Math.min(score, 70);
  const cur = run.results[run.i];
  if (!cur.tried || score > cur.score){ cur.score = score; cur.answer = raw; }
  cur.tried = true;
  const head = {perfect:"완벽해요!", good:"잘했어요! 뜻이 잘 전달됐어요", fix:"틀린 부분이 있어요", retry:"조금 더 해 볼까요?"}[r.status];
  let body = "";
  if (r.errors.length) body += `<ul>${r.errors.map(e=>`<li>${esc(e.msg)}<small>${esc(e.ex)}</small></li>`).join("")}</ul>`;
  if ((r.status === "retry" || r.status === "fix") && r.missing.length) body += `<ul>${r.missing.map(m=>`<li>핵심 표현이 빠졌어요: <b>${esc(m.k)}</b> (${esc(m.ko)})</li>`).join("")}</ul>`;
  if (r.tips.length) body += `<ul>${r.tips.map(x=>`<li><small style="color:inherit">${esc(x)}</small></li>`).join("")}</ul>`;
  const n = norm(raw);
  const modelLabel = r.status === "perfect" ? "모범답안과 같아요" : r.status === "good" ? "이렇게 말하면 더 자연스러워요 (노란색: 내 답에 없던 단어)" : "이렇게 말해 보세요 (노란색: 내 답에 없던 단어)";
  const el = addHtml(`<div class="fb ${r.status}">
    <div class="head"><span>${head}</span><span class="score">${score}점</span></div>
    ${body}
    <div class="model"><small>${modelLabel}</small><div class="en">${r.status==="perfect" ? esc(r.best) : markModel(r.best, n)}</div>
      <div class="acts" style="margin-top:6px"><button class="mini" data-a="spk">${ICON.spk} 발음 듣기</button><button class="mini" data-a="pr">${ICON.mic} 발음 연습</button>${LANG4[t.answers[0]] ? `<button class="mini" data-a="m4">🌏 모범답안 4개국어</button>` : ""}</div>${LANG4[t.answers[0]] ? `<div class="m4" hidden>${card4(t.answers[0], "")}</div>` : ""}</div>
    <div class="btns">${r.status==="perfect"||r.status==="good" ? `<button class="btn pri" data-a="next">다음 대화로</button><button class="btn" data-a="again">다시 말해 보기</button>` : `<button class="btn pri" data-a="again">다시 말해 보기</button><button class="btn" data-a="next">다음으로 넘어가기</button>`}</div>
  </div>`);
  el.querySelector('[data-a="spk"]').onclick = () => speak(r.best);
  el.querySelector('[data-a="pr"]').onclick = () => openPron(r.best, sc => { cur.pron = Math.max(cur.pron || 0, sc); });
  const m4b = el.querySelector('[data-a="m4"]'); if (m4b) m4b.onclick = () => { const b = el.querySelector(".m4"); b.hidden = !b.hidden; m4b.textContent = b.hidden ? "🌏 모범답안 4개국어" : "🌏 4개국어 숨기기"; if (!b.hidden) scrollEnd(); };
  el.querySelector('[data-a="again"]').onclick = () => { const m = document.getElementById("mic");
    if ((SR || V.dict || nativeSpeech()) && micFails === 0 && m && !listening) startAnswerMic(m); else ta.focus(); };
  el.querySelector('[data-a="next"]').onclick = e => { e.currentTarget.disabled = true; nextTurn(); };
}
function nextTurn(){
  if (run.waiting) return;
  run.waiting = true;
  if (listening) resetListening();
  document.querySelectorAll('.fb [data-a="next"]').forEach(b => b.disabled = true);
  run.i++;
  document.getElementById("ta").disabled = true;
  if (run.i >= run.s.turns.length){ document.getElementById("pbar").style.width = "100%"; setTimeout(finish, 400); return; }
  const typing = addHtml(`<div class="typing">${esc(run.s.partner)} 님이 말하는 중…</div>`);
  setTimeout(()=>{ typing.remove(); addAi(); }, 650);
}
function finish(){
  stopVoice();
  const s = run.s;
  const total = Math.round(run.results.reduce((a,r)=>a+r.score,0) / s.turns.length);
  const prev = DB.scores[s.id];
  if (prev == null || total > prev){ DB.scores[s.id] = total; save(); }
  const idx = SCENARIOS.indexOf(s);
  const nxt = SCENARIOS.slice(idx+1).concat(SCENARIOS.slice(0, idx)).find(x => !isLocked(x) && DB.scores[x.id] == null);
  const pill = sc => `<span class="pill ${sc>=80?"p-ok":sc>=50?"p-mid":"p-bad"}">${sc}점</span>`;
  $app.innerHTML = `<div class="scroll"><div class="wrap res">
    <span class="lv lv${s.lv}">${CATS[s.cat].ko} · ${LEVELS[s.lv]}</span>
    <h2 class="brand" style="font-size:28px">${esc(s.title)}</h2>
    <div class="big">${total}<small>점</small> <span class="stars" style="font-size:24px">${stars(total)}</span></div>
    <p style="margin:0;color:var(--muted)">${total>=90?"훌륭해요! 다음 단계로 넘어가도 좋아요.":total>=70?"좋아요! 노란색으로 표시된 표현을 한 번 더 연습해 보세요.":"괜찮아요. 모범답안을 소리 내어 따라 읽고 다시 도전해 보세요."}${prev!=null?` (이전 최고 ${prev}점)`:""}</p>
    <p style="margin:0;color:var(--muted);font-size:13px">${run.results.some(r=>r.pron!=null) ? `발음 연습 평균 ${Math.round(run.results.filter(r=>r.pron!=null).reduce((a,r)=>a+r.pron,0)/run.results.filter(r=>r.pron!=null).length)}점` : "피드백 카드의 ‘발음 연습’으로 모범답안을 원어민처럼 따라 말해 보세요."}</p>
    ${s.turns.map((t,i)=>`<div class="rline">
      <div class="row"><span class="q">${esc(s.partner)}: ${esc(t.ai)}</span><span style="display:flex;gap:4px;flex:none">${pill(run.results[i].score)}${run.results[i].pron!=null?`<span class="pill ${run.results[i].pron>=90?"p-ok":run.results[i].pron>=70?"p-mid":"p-bad"}">발음 ${run.results[i].pron}</span>`:""}</span></div>
      <div>나: ${run.results[i].answer ? esc(run.results[i].answer) : `<span style="color:var(--muted)">(건너뜀)</span>`}</div>
      <div style="color:var(--ok)">모범: ${esc(t.answers[0])}</div></div>`).join("")}
    <div style="display:flex;gap:8px;flex-wrap:wrap">
      <button class="btn pri" id="again">다시 도전</button>
      ${nxt ? `<button class="btn" id="nxt">다음 대화: ${esc(nxt.ko)}</button>` : ""}
      <button class="btn" id="l4r">🌏 4개국어로 복습</button>
      <button class="btn" id="home">목록으로</button>
    </div>
    ${AD_HTML ? `<div class="ad">${AD_HTML}</div>` : ""}
  </div></div>`;
  document.getElementById("again").onclick = () => openScenario(s.id);
  document.getElementById("l4r").onclick = () => renderL4(s.id);
  document.getElementById("home").onclick = renderHome;
  if (nxt) document.getElementById("nxt").onclick = () => openScenario(nxt.id);
}

try { loadVoices(); speechSynthesis.onvoiceschanged = () => { loadVoices(); updVstat(); }; } catch(e){}
// 아이폰 사파리는 화면을 처음 터치할 때 음성을 "깨워" 둬야 이후 자동 읽기가 소리 납니다.
(function unlockSpeech(){
  const go = () => { try { const u = new SpeechSynthesisUtterance(" "); u.volume = 0; speechSynthesis.speak(u); } catch(e){}
    document.removeEventListener("touchend", go, true); document.removeEventListener("click", go, true); };
  document.addEventListener("touchend", go, true); document.addEventListener("click", go, true);
})();
renderHome();
// 아이폰 사파리(홈 화면 앱이 아닐 때)에서만 '홈 화면에 추가' 안내를 한 번 보여 줍니다.
(function homeHint(){ try {
  if (!IS_IOS || IS_STANDALONE || IS_NATIVE_APP || localStorage.getItem(STORE_KEY + ".a2hs")) return;
  const el = document.getElementById("a2hs"); el.hidden = false;
  document.getElementById("a2hsX").onclick = () => { el.hidden = true; try { localStorage.setItem(STORE_KEY + ".a2hs", "1"); } catch(e){} };
  document.addEventListener("click", e => { if (!el.contains(e.target)) el.hidden = true; }, true);
} catch(e){} })();
</script>
