<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png">
<meta name="theme-color" content="#2F5BEA">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="TalkStep">
<meta name="format-detection" content="telephone=no">
<meta name="description" content="생활·비즈니스·여행 영어회화를 실제 대화처럼 연습하고, 틀린 부분은 한국어로 바로 교정받는 학습 앱">
<!--HEAD-START-->
<title>TalkStep 영어회화</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,800&family=Noto+Sans+KR:wght@400;500;700&display=swap">
<style>
/* Layout: one-screen app. Home = scrolling card grid; Chat = header / message list / composer column, centered at 760px on desktop. */
:root{
  --bg:#F4F6FA; --surface:#FFFFFF; --ink:#1B2333; --muted:#5D6880; --line:#DDE2EA;
  --accent:#2F5BEA; --accent-ink:#FFFFFF; --accent-soft:#E6ECFF;
  --ok:#1A7F52; --ok-soft:#E2F3EA; --warn:#9A6411; --warn-soft:#FFF3D6;
  --err:#C9302A; --err-soft:#FDE8E6; --mark:#FFE58A; --mark-ink:#1B2333;
  --bubble-me:#2F5BEA; --bubble-me-ink:#FFFFFF;
  --f-display:"Bricolage Grotesque","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR",system-ui,-apple-system,"Apple SD Gothic Neo","Malgun Gothic",sans-serif;
  --r:14px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#10141C; --surface:#182030; --ink:#E7EBF3; --muted:#9AA5BB; --line:#2A3447;
  --accent:#7D9BFF; --accent-ink:#0E1424; --accent-soft:#1F2A4A;
  --ok:#4CC38A; --ok-soft:#14302A; --warn:#E3B45A; --warn-soft:#33290F;
  --err:#FF7A70; --err-soft:#3A1A1A; --mark:#6D5A14; --mark-ink:#FFF6D6;
  --bubble-me:#3D5FD6; --bubble-me-ink:#FFFFFF; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#10141C; --surface:#182030; --ink:#E7EBF3; --muted:#9AA5BB; --line:#2A3447;
  --accent:#7D9BFF; --accent-ink:#0E1424; --accent-soft:#1F2A4A;
  --ok:#4CC38A; --ok-soft:#14302A; --warn:#E3B45A; --warn-soft:#33290F;
  --err:#FF7A70; --err-soft:#3A1A1A; --mark:#6D5A14; --mark-ink:#FFF6D6;
  --bubble-me:#3D5FD6; --bubble-me-ink:#FFFFFF; color-scheme:dark}
*{box-sizing:border-box}
[hidden]{display:none!important}
html{height:100%}
body{height:100%;margin:0;overflow:hidden;background:var(--bg);color:var(--ink);font-family:var(--f-body);font-size:15px;line-height:1.55}
button,input,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
#app{height:100%}
.wrap{max-width:960px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.scroll{height:100%;overflow-y:auto;-webkit-overflow-scrolling:touch}

/* ---------- Home ---------- */
.top{padding-block:28px 8px;display:flex;flex-direction:column;gap:6px}
.brand{font-family:var(--f-display);font-weight:800;font-size:clamp(28px,6vw,40px);letter-spacing:-.02em;margin:0;line-height:1.05}
.brand span{color:var(--accent)}
.tag{color:var(--muted);margin:0;text-wrap:balance}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:10px;margin-block:18px}
.stat{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px}
.stat b{display:block;font-family:var(--f-display);font-size:24px;font-variant-numeric:tabular-nums;line-height:1.2}
.stat small{color:var(--muted);font-size:12px}
.resume{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;background:var(--accent-soft);border-radius:var(--r);padding:14px 16px;margin-bottom:18px}
.resume p{margin:0;min-width:0}
.resume small{color:var(--muted);display:block;font-size:12px}
.seg{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;background:var(--surface);border:1px solid var(--line);border-radius:12px;padding:4px}
.seg button{border:0;background:transparent;border-radius:9px;padding:10px 6px;font-weight:700}
.seg button[aria-pressed="true"]{background:var(--accent);color:var(--accent-ink)}
.seg small{display:block;font-weight:400;font-size:11px;opacity:.8}
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-block:14px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 14px;font-size:13px}
.chip[aria-pressed="true"]{border-color:var(--accent);color:var(--accent);font-weight:700}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px;padding-bottom:28px}
.card{text-align:left;background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:8px;min-width:0}
.card:hover{border-color:var(--accent)}
.card h3{margin:0;font-family:var(--f-display);font-weight:600;font-size:18px;line-height:1.25}
.card .ko{color:var(--muted);font-size:13px;margin:0}
.card .row{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-top:auto;padding-top:6px;font-size:13px;color:var(--muted)}
.lv{display:inline-block;font-size:11px;font-weight:700;letter-spacing:.04em;padding:2px 8px;border-radius:6px;width:max-content}
.lv1{background:var(--ok-soft);color:var(--ok)}
.lv2{background:var(--warn-soft);color:var(--warn)}
.lv3{background:var(--err-soft);color:var(--err)}
.stars{letter-spacing:2px;color:var(--warn);font-variant-numeric:tabular-nums}
.lock{display:inline-flex;align-items:center;gap:4px;color:var(--warn);font-weight:700}
.ad{border:1px dashed var(--line);border-radius:var(--r);padding:12px;margin-bottom:24px;color:var(--muted);font-size:13px}
.foot{color:var(--muted);font-size:12px;padding-bottom:28px;display:flex;gap:12px;flex-wrap:wrap;justify-content:space-between}
.linkbtn{border:0;background:none;color:var(--muted);text-decoration:underline;padding:0;font-size:12px}

/* ---------- Chat ---------- */
.chat{height:100%;display:flex;flex-direction:column}
.bar{background:var(--surface);border-bottom:1px solid var(--line)}
.bar .wrap{display:flex;align-items:center;gap:10px;padding-block:10px;max-width:760px}
.iconbtn{border:1px solid var(--line);background:var(--surface);border-radius:10px;width:40px;height:40px;display:inline-grid;place-items:center;flex:none}
.iconbtn svg{width:20px;height:20px}
.bar .t{min-width:0;flex:1}
.bar .t b{display:block;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;font-family:var(--f-display);font-weight:600;font-size:16px}
.bar .t small{color:var(--muted);font-size:12px}
.prog{height:3px;background:var(--line)}
.prog i{display:block;height:100%;background:var(--accent);transition:width .3s}
.msgs{flex:1;overflow-y:auto;-webkit-overflow-scrolling:touch}
.msgs .wrap{max-width:760px;display:flex;flex-direction:column;gap:12px;padding-block:16px 24px}
.situ{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:14px 16px;font-size:14px}
.situ b{display:block;font-size:12px;color:var(--accent);letter-spacing:.04em;margin-bottom:2px}
.msg{display:flex;gap:8px;align-items:flex-end;max-width:88%}
.msg.ai{align-self:flex-start}
.msg.me{align-self:flex-end;flex-direction:row-reverse}
.av{flex:none;width:32px;height:32px;border-radius:50%;background:var(--accent-soft);color:var(--accent);display:grid;place-items:center;font-weight:700;font-size:13px}
.bub{border-radius:16px;padding:10px 14px;min-width:0;overflow-wrap:anywhere}
.ai .bub{background:var(--surface);border:1px solid var(--line);border-bottom-left-radius:4px}
.me .bub{background:var(--bubble-me);color:var(--bubble-me-ink);border-bottom-right-radius:4px}
.bub .en{font-size:16px}
.bub .tr{color:var(--muted);font-size:13px;margin-top:4px}
.bub .acts{display:flex;gap:6px;margin-top:8px}
.mini{border:1px solid var(--line);background:transparent;border-radius:8px;padding:3px 9px;font-size:12px;display:inline-flex;align-items:center;gap:4px}
.mini svg{width:14px;height:14px}
.typing{color:var(--muted);font-size:13px}
.fb{border-radius:var(--r);padding:14px 16px;border:1px solid;display:flex;flex-direction:column;gap:10px;font-size:14px}
.fb.perfect,.fb.good{background:var(--ok-soft);border-color:color-mix(in srgb,var(--ok) 35%,transparent)}
.fb.fix{background:var(--err-soft);border-color:color-mix(in srgb,var(--err) 35%,transparent)}
.fb.retry{background:var(--warn-soft);border-color:color-mix(in srgb,var(--warn) 35%,transparent)}
.fb .head{display:flex;align-items:center;justify-content:space-between;gap:8px;font-weight:700}
.fb.perfect .head,.fb.good .head{color:var(--ok)}
.fb.fix .head{color:var(--err)}
.fb.retry .head{color:var(--warn)}
.fb .score{font-family:var(--f-display);font-variant-numeric:tabular-nums}
.fb ul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:6px}
.fb li small{display:block;color:var(--muted)}
.fb .model{background:var(--surface);border-radius:10px;padding:10px 12px}
.fb .model small{display:block;color:var(--muted);font-size:12px;margin-bottom:2px}
.fb .model .en{font-size:15px}
mark{background:var(--mark);color:var(--mark-ink);border-radius:3px;padding:0 2px}
.fb .btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 14px;font-weight:700;font-size:14px}
.btn.pri{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.compose{background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.compose .wrap{max-width:760px;padding-block:10px;display:flex;flex-direction:column;gap:8px}
.mission{display:flex;align-items:flex-start;justify-content:space-between;gap:10px;font-size:14px}
.mission p{margin:0;min-width:0}
.mission p b{color:var(--accent);font-size:12px;letter-spacing:.04em;display:block}
.mission .side{display:flex;gap:6px;flex:none}
.inrow{display:flex;gap:8px;align-items:flex-end}
.inrow textarea{flex:1;min-width:0;resize:none;border:1px solid var(--line);background:var(--bg);border-radius:12px;padding:10px 12px;min-height:46px;max-height:120px;font-size:16px}
.send{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.mic.on{background:var(--err);border-color:var(--err);color:#fff}
.peek{font-size:13px;background:var(--accent-soft);border-radius:10px;padding:8px 12px}

/* ---------- Result ---------- */
.res{padding-block:24px 32px;max-width:760px;display:flex;flex-direction:column;gap:14px}
.big{font-family:var(--f-display);font-weight:800;font-size:64px;line-height:1;font-variant-numeric:tabular-nums}
.big small{font-size:20px;color:var(--muted)}
.rline{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px 14px;display:flex;flex-direction:column;gap:4px;font-size:14px}
.rline .q{color:var(--muted)}
.rline .row{display:flex;justify-content:space-between;gap:8px}
.pill{font-size:12px;font-weight:700;border-radius:999px;padding:1px 9px;flex:none;font-variant-numeric:tabular-nums;align-self:flex-start;white-space:nowrap}
.p-ok{background:var(--ok-soft);color:var(--ok)}.p-mid{background:var(--warn-soft);color:var(--warn)}.p-bad{background:var(--err-soft);color:var(--err)}

/* ---------- Sheet / toast ---------- */
.sheet{position:fixed;inset:0;background:rgba(0,0,0,.45);background:color-mix(in srgb,#000 45%,transparent);display:grid;place-items:end center;z-index:50;padding:0 max(12px,env(safe-area-inset-right,0px)) max(12px,env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.sheet .in{background:var(--surface);border-radius:18px;padding:20px;width:100%;max-width:480px;display:flex;flex-direction:column;gap:12px;margin-bottom:12px;max-height:88vh;overflow-y:auto}
.sheet select{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:8px 10px;font-size:16px;max-width:100%}
.opt{display:flex;flex-direction:column;gap:6px;font-size:14px}
.pmeta{margin:0;color:var(--muted);font-size:13px}
.ptarget{margin:0;font-size:20px;line-height:1.9;display:flex;flex-wrap:wrap;gap:2px 6px}
.pw{border:0;background:none;padding:0 3px;border-radius:6px;font-size:inherit;color:var(--muted);border-bottom:2px solid transparent}
.pw.st{color:var(--ink);font-weight:700}
.pw.ok{border-bottom-color:var(--ok);background:var(--ok-soft)}
.pw.bad{border-bottom-color:var(--err);background:var(--err-soft);color:var(--err)}
.prow{display:flex;gap:6px;flex-wrap:wrap}
.ptips{background:var(--accent-soft);border-radius:12px;padding:10px 12px;font-size:13px}
.ptips ul{margin:6px 0 0;padding-left:18px;display:flex;flex-direction:column;gap:4px}
.ptips li span{font-weight:700;color:var(--accent)}
.pmic{display:flex;align-items:center;justify-content:center;gap:8px;padding:12px}
.pmic svg{width:18px;height:18px}
.pmic.on{background:var(--err);border-color:var(--err);color:#fff}
.pheard{margin:0;font-size:14px;color:var(--muted)}
.sheet h2{margin:0;font-family:var(--f-display);font-size:22px}
.sheet input{border:1px solid var(--line);background:var(--bg);border-radius:10px;padding:10px 12px;font-size:16px}
.a2hs{position:fixed;left:max(12px,env(safe-area-inset-left,0px));right:max(12px,env(safe-area-inset-right,0px));bottom:calc(12px + env(safe-area-inset-bottom,0px));background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:14px;padding:10px 12px;font-size:13px;line-height:1.5;display:flex;gap:10px;align-items:center;z-index:55;box-shadow:0 6px 20px rgba(0,0,0,.15)}.a2hs[hidden]{display:none}.a2hs span{flex:1}.a2hs button{border:0;background:transparent;font-size:16px;padding:4px 8px;color:inherit}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(90px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--bg);padding:9px 16px;border-radius:999px;font-size:13px;z-index:60;max-width:calc(100% - 32px);text-align:center}
/* ---------- 4개국어 카드 (영어 → 일어 → 중국어 → 한국어) ---------- */
.c4{display:flex;flex-direction:column;gap:6px;min-width:0}
.l4{--l4c:#2F5BEA;display:flex;gap:8px;align-items:flex-start;border-radius:10px;padding:6px 6px 6px 8px;background:color-mix(in srgb,var(--l4c) 6%,transparent);transition:background .2s,box-shadow .2s}
.l4.ja{--l4c:#D6336C}.l4.zh{--l4c:#E8590C}.l4.ko{--l4c:#1A7F52}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]) .l4{--l4c:#8FA8FF}:root:not([data-theme="light"]) .l4.ja{--l4c:#FF8FB1}:root:not([data-theme="light"]) .l4.zh{--l4c:#FFA94D}:root:not([data-theme="light"]) .l4.ko{--l4c:#63E6BE}}
.l4 .lb{flex:none;font-size:11px;font-weight:700;border-radius:6px;padding:2px 4px;margin-top:3px;min-width:54px;text-align:center;background:color-mix(in srgb,var(--l4c) 16%,transparent);color:var(--l4c)}
.l4 .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.l4 .m{font-size:16px;line-height:1.45}
.l4 .rd,.l4 .pr{font-size:12.5px;color:var(--muted);line-height:1.4}
.l4 .cue{display:none;font-size:12px;font-weight:700;color:var(--l4c);margin-top:2px}
.l4 .nv{font-size:12px;color:var(--err);margin-top:2px}
.l4 .sp{flex:none;padding:5px 7px}
.l4.now{background:color-mix(in srgb,var(--l4c) 16%,transparent);box-shadow:inset 3px 0 0 var(--l4c)}
.l4.rep{box-shadow:inset 3px 0 0 var(--l4c)}
.l4.rep .cue{display:block}
.l4.nov .m{opacity:.55}
.c4b{display:flex;gap:6px;flex-wrap:wrap}
.p4.on,.l4all.on{background:var(--err);border-color:var(--err);color:#fff}
.c4.fold .l4:not(.en),.c4.fold .c4b{display:none}
.c4miss{margin:0;font-size:12px;color:var(--muted)}
[lang="ja"]{font-family:"Hiragino Sans","Hiragino Kaku Gothic ProN","Noto Sans JP","Noto Sans CJK JP",system-ui,sans-serif}
[lang="zh-CN"]{font-family:"PingFang SC","Hiragino Sans GB","Noto Sans SC","Noto Sans CJK SC",system-ui,sans-serif}
.l4ban{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;border-radius:var(--r);padding:14px 16px;margin-bottom:18px;color:#fff;background:linear-gradient(120deg,#2F5BEA 0%,#D6336C 55%,#E8590C 100%)}
.l4ban p{margin:0;min-width:0}.l4ban b{display:block;font-size:16px}.l4ban small{display:block;font-size:12px;opacity:.92}
.l4ban .btn{background:#fff;border-color:#fff;color:#2F5BEA}
.l4page{max-width:760px;display:flex;flex-direction:column;gap:12px;padding-block:16px 32px}
.l4top{display:flex;align-items:center;gap:10px}
.l4top .brand{font-size:26px}
.l4page select{border:1px solid var(--line);background:var(--surface);border-radius:10px;padding:9px 10px;font-size:16px;max-width:100%}
.l4item{background:var(--surface);border:1px solid var(--line);border-radius:var(--r);padding:12px;display:flex;flex-direction:column;gap:8px}
.l4item.me{border-color:color-mix(in srgb,var(--accent) 40%,var(--line))}
.l4who{font-size:12px;font-weight:700;color:var(--muted)}
.vstat{margin:0;font-size:12.5px;color:var(--muted)}
.vstat b{font-weight:700}.vstat .ok{color:var(--ok)}.vstat .no{color:var(--err)}
.pv{display:inline-block;width:max-content;font-size:11px;font-weight:700;padding:2px 8px;border-radius:6px;background:var(--warn-soft);color:var(--warn)}
.m4{margin-top:8px}
.bub .acts{flex-wrap:wrap}.bub .acts .mini{white-space:nowrap}
.msg.ai:has(.c4){max-width:96%}
.bub .l4 .lb{min-width:48px}
@media (max-width:480px){.stats{gap:6px}.stat{padding:10px}.stat b{font-size:20px}.msg{max-width:94%}}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
<!--HEAD-END-->
</head>
<body>
<!--BODY-START-->
<div id="app"></div>
<div id="sheet" class="sheet" hidden></div>
<div id="toast" class="toast" hidden></div>
<div id="a2hs" class="a2hs" hidden><span>📲 아이폰에서 앱처럼 쓰기: 아래 <b>공유</b> 버튼 → <b>홈 화면에 추가</b></span><button type="button" id="a2hsX" aria-label="안내 닫기">✕</button></div>
<script>
/* =========================================================
   1) 설정 (수익화 옵션) — 여기만 바꾸면 됩니다
   ========================================================= */
const CONFIG = {
  // 유료로 잠글 레벨. 예) [3] → 고급만 유료, [2,3] → 중급+고급 유료, [] → 전부 무료
  premiumLevels: [],
  // 구매자에게 줄 잠금해제 코드 (대문자). 판매처에서 구매 후 안내 메시지로 전달하세요.
  unlockCodes: ["TALKSTEP-VIP"],
  // 결제 페이지 주소 (크몽·탈잉·스마트스토어·Gumroad 등 본인 판매 페이지)
  buyUrl: "",
  premiumPrice: "9,900원 (평생 이용)",
  // 홈/결과 화면 하단에 보여줄 광고·홍보 HTML (빈 칸이면 숨김)
  adHtml: ""
};

/* =========================================================
   3) 교정 엔진 — 영어 문장을 분석해서 한국어로 설명
   ========================================================= */
/* =========================================================
   2-1) 4개국어 문장 — 문장 하나를 영어 → 일어 → 중국어 → 한국어 순서로 따라 말하기
   형식:  L4("영어 문장", {enK, ja, jaR, jaK, zh, py, zhK, ko});
     · 영어 문장 = 위 T(...)의 상대 대사(첫 칸) 또는 모범답안 첫 번째와 글자 하나까지 똑같이
     · enK 영어 한글 발음 / ja 일본어 / jaR 일본어 읽기(한자가 있을 때만 히라가나로, 없으면 생략)
       jaK 일본어 한글 발음 / zh 중국어(간체, 표준중국어) / py 병음(성조 표시) / zhK 중국어 한글 발음 / ko 한국어
   매주 월요일 새 대화를 넣을 때: 5턴 × (상대 대사 + 모범답안 첫 번째) = 10문장을 모두 L4로 추가하세요.
   빠진 문장은 카드에 "준비 중"으로 표시되고, 브라우저 콘솔에 목록이 나옵니다.
   ========================================================= */
const LANG4 = {};
function L4(en, o){ LANG4[en] = o; }

L4("Hi! I'm Emma. I just moved in next door.", {enK:"하이! 아임 엠마. 아이 저스트 무브드 인 넥스트 도어.", ja:"こんにちは！エマです。隣に引っ越してきたばかりです。", jaR:"こんにちは！エマです。となりにひっこしてきたばかりです。", jaK:"곤니치와! 에마데스. 도나리니 힛코시테 키타 바카리데스.", zh:"你好！我是艾玛。我刚搬到隔壁。", py:"Nǐ hǎo! Wǒ shì Àimǎ. Wǒ gāng bān dào gébì.", zhK:"니하오! 워 스 아이마. 워 깡 반 다오 거비.", ko:"안녕하세요! 저는 엠마예요. 옆집에 막 이사 왔어요."});

L4("Where are you from?", {enK:"웨어 아 유 프롬?", ja:"どちらのご出身ですか？", jaR:"どちらのごしゅっしんですか？", jaK:"도치라노 고슛신데스카?", zh:"你是哪里人？", py:"Nǐ shì nǎlǐ rén?", zhK:"니 스 나리 런?", ko:"어디에서 오셨어요?"});
L4("I'm from Korea.", {enK:"아임 프롬 코리아.", ja:"韓国から来ました。", jaR:"かんこくからきました。", jaK:"간코쿠카라 기마시타.", zh:"我来自韩国。", py:"Wǒ láizì Hánguó.", zhK:"워 라이쯔 한궈.", ko:"한국에서 왔어요."});
L4("Oh, cool! How long have you lived here?", {enK:"오, 쿨! 하우 롱 해브 유 리브드 히어?", ja:"へえ、いいですね！ここに住んでどのくらいですか？", jaR:"へえ、いいですね！ここにすんでどのくらいですか？", jaK:"헤에, 이이데스네! 고코니 슨데 도노쿠라이데스카?", zh:"哦，真不错！你在这里住了多久了？", py:"Ò, zhēn búcuò! Nǐ zài zhèlǐ zhùle duō jiǔ le?", zhK:"오, 쩐 부춰! 니 짜이 쩌리 주러 둬 지우 러?", ko:"오, 멋지네요! 여기 사신 지 얼마나 됐어요?"});
L4("I've lived here for two years.", {enK:"아이브 리브드 히어 포 투 이어즈.", ja:"ここに住んで2年になります。", jaR:"ここにすんでにねんになります。", jaK:"고코니 슨데 니넨니 나리마스.", zh:"我在这里住了两年了。", py:"Wǒ zài zhèlǐ zhùle liǎng nián le.", zhK:"워 짜이 쩌리 주러 량 녠 러.", ko:"여기서 2년 살았어요."});

L4("Yes, there's a nice cafe on the corner.", {enK:"예스, 데어즈 어 나이스 카페이 온 더 코너.", ja:"はい、角にすてきなカフェがありますよ。", jaR:"はい、かどにすてきなカフェがありますよ。", jaK:"하이, 가도니 스테키나 카페가 아리마스요.", zh:"有，拐角那儿有一家不错的咖啡馆。", py:"Yǒu, guǎijiǎo nàr yǒu yì jiā búcuò de kāfēiguǎn.", zhK:"여우, 과이자오 날 여우 이 자 부춰 더 카페이관.", ko:"네, 모퉁이에 괜찮은 카페가 있어요."});
L4("Thanks! Let's have coffee together sometime.", {enK:"땡스! 렛츠 해브 커피 투게더 썸타임.", ja:"ありがとう！今度一緒にコーヒーを飲みましょう。", jaR:"ありがとう！こんどいっしょにコーヒーをのみましょう。", jaK:"아리가토! 곤도 잇쇼니 코히오 노미마쇼.", zh:"谢谢！改天一起喝咖啡吧。", py:"Xièxie! Gǎitiān yìqǐ hē kāfēi ba.", zhK:"셰셰! 가이톈 이치 허 카페이 바.", ko:"고마워요! 언제 같이 커피 마셔요."});
L4("Sure, that sounds great!", {enK:"슈어, 댓 사운즈 그레잇!", ja:"ええ、いいですね！", jaK:"에에, 이이데스네!", zh:"好啊，听起来不错！", py:"Hǎo a, tīng qǐlái búcuò!", zhK:"하오 아, 팅 치라이 부춰!", ko:"좋아요, 그거 좋네요!"});

L4("Okay. Take this twice a day after meals.", {enK:"오케이. 테이크 디스 트와이스 어 데이 애프터 밀즈.", ja:"わかりました。これを1日2回、食後に飲んでください。", jaR:"わかりました。これをいちにちにかい、しょくごにのんでください。", jaK:"와카리마시타. 고레오 이치니치 니카이, 쇼쿠고니 논데 쿠다사이.", zh:"好的。这个一天两次，饭后吃。", py:"Hǎo de. Zhège yì tiān liǎng cì, fàn hòu chī.", zhK:"하오 더. 쩌거 이 톈 량 츠, 판 허우 츠.", ko:"네. 이걸 하루 두 번 식후에 드세요."});
L4("Will it make me sleepy?", {enK:"윌 잇 메이크 미 슬리피?", ja:"眠くなりますか？", jaR:"ねむくなりますか？", jaK:"네무쿠 나리마스카?", zh:"吃了会犯困吗？", py:"Chīle huì fànkùn ma?", zhK:"츠러 후이 판쿤 마?", ko:"이거 먹으면 졸려요?"});

L4("Okay, I understand. Thank you.", {enK:"오케이, 아이 언더스탠드. 땡큐.", ja:"はい、わかりました。ありがとうございます。", jaK:"하이, 와카리마시타. 아리가토 고자이마스.", zh:"好的，我明白了。谢谢。", py:"Hǎo de, wǒ míngbai le. Xièxie.", zhK:"하오 더, 워 밍바이 러. 셰셰.", ko:"네, 알겠어요. 고맙습니다."});

L4("Oh no, I had no idea. I'm so sorry about that.", {enK:"오 노, 아이 해드 노 아이디어. 아임 쏘 쏘리 어바웃 댓.", ja:"えっ、全然気づきませんでした。本当にすみません。", jaR:"えっ、ぜんぜんきづきませんでした。ほんとうにすみません。", jaK:"엣, 젠젠 기즈키마센데시타. 혼토니 스미마센.", zh:"哎呀，我完全不知道。真的很抱歉。", py:"Āiyā, wǒ wánquán bù zhīdào. Zhēn de hěn bàoqiàn.", zhK:"아이야, 워 완취안 뿌 즈다오. 쩐 더 헌 바오첸.", ko:"어머, 전혀 몰랐어요. 정말 죄송해요."});
L4("That's okay. I just have to get up early for work.", {enK:"댓츠 오케이. 아이 저스트 해브 투 겟 업 얼리 포 워크.", ja:"大丈夫です。ただ、仕事で朝早く起きなければならないんです。", jaR:"だいじょうぶです。ただ、しごとであさはやくおきなければならないんです。", jaK:"다이조부데스. 다다, 시고토데 아사 하야쿠 오키나케레바 나라나인데스.", zh:"没关系。只是我上班得早起。", py:"Méi guānxi. Zhǐshì wǒ shàngbān děi zǎo qǐ.", zhK:"메이 관시. 즈스 워 상반 데이 자오 치.", ko:"괜찮아요. 다만 일 때문에 아침 일찍 일어나야 해서요."});
L4("I totally understand. What time would be okay?", {enK:"아이 토털리 언더스탠드. 왓 타임 우드 비 오케이?", ja:"よくわかります。何時までなら大丈夫ですか？", jaR:"よくわかります。なんじまでならだいじょうぶですか？", jaK:"요쿠 와카리마스. 난지마데나라 다이조부데스카?", zh:"我完全理解。几点以前可以？", py:"Wǒ wánquán lǐjiě. Jǐ diǎn yǐqián kěyǐ?", zhK:"워 완취안 리제. 지 뎬 이첸 커이?", ko:"충분히 이해해요. 몇 시까지면 괜찮을까요?"});

L4("Of course. I'll make sure to keep it down.", {enK:"오브 코스. 아일 메이크 슈어 투 킵 잇 다운.", ja:"もちろんです。必ず音を小さくします。", jaR:"もちろんです。かならずおとをちいさくします。", jaK:"모치론데스. 가나라즈 오토오 치이사쿠 시마스.", zh:"当然。我一定会小声点。", py:"Dāngrán. Wǒ yídìng huì xiǎo shēng diǎn.", zhK:"당란. 워 이딩 후이 샤오 성 뎬.", ko:"물론이죠. 꼭 소리 줄일게요."});
L4("I really appreciate your understanding.", {enK:"아이 리얼리 어프리시에이트 유어 언더스탠딩.", ja:"ご理解いただき、本当にありがとうございます。", jaR:"ごりかいいただき、ほんとうにありがとうございます。", jaK:"고리카이 이타다키, 혼토니 아리가토 고자이마스.", zh:"非常感谢你的理解。", py:"Fēicháng gǎnxiè nǐ de lǐjiě.", zhK:"페이창 간셰 니 더 리제.", ko:"이해해 주셔서 정말 감사해요."});

L4("What do you like most about it?", {enK:"왓 두 유 라이크 모스트 어바웃 잇?", ja:"一番いいところは何？", jaR:"いちばんいいところはなに？", jaK:"이치반 이이 도코로와 나니?", zh:"你最喜欢它哪一点？", py:"Nǐ zuì xǐhuan tā nǎ yì diǎn?", zhK:"니 쭈이 시환 타 나 이 뎬?", ko:"재택근무의 어떤 점이 제일 좋아?"});
L4("I can save a lot of time on commuting.", {enK:"아이 캔 세이브 어 랏 오브 타임 온 커뮤팅.", ja:"通勤時間がかなり節約できること。", jaR:"つうきんじかんがかなりせつやくできること。", jaK:"쓰킨 지칸가 가나리 세쓰야쿠 데키루 고토.", zh:"可以省下很多通勤时间。", py:"Kěyǐ shěng xià hěn duō tōngqín shíjiān.", zhK:"커이 성 샤 헌 둬 퉁친 스젠.", ko:"출퇴근 시간을 많이 아낄 수 있어."});
L4("That's true. But don't you feel lonely sometimes?", {enK:"댓츠 트루. 벗 돈츄 필 론리 썸타임즈?", ja:"確かに。でも、ときどき寂しくならない？", jaR:"たしかに。でも、ときどきさびしくならない？", jaK:"다시카니. 데모, 도키도키 사비시쿠 나라나이?", zh:"确实。不过你有时候不觉得孤单吗？", py:"Quèshí. Búguò nǐ yǒu shíhou bù juéde gūdān ma?", zhK:"췌스. 부궈 니 여우 스허우 뿌 줴더 구단 마?", ko:"맞아. 그래도 가끔 외롭지 않아?"});
L4("Yes, I sometimes miss talking with my coworkers.", {enK:"예스, 아이 썸타임즈 미스 토킹 위드 마이 코워커즈.", ja:"うん、ときどき同僚とのおしゃべりが恋しくなる。", jaR:"うん、ときどきどうりょうとのおしゃべりがこいしくなる。", jaK:"웅, 도키도키 도료토노 오샤베리가 고이시쿠 나루.", zh:"是啊，有时候挺想跟同事聊天的。", py:"Shì a, yǒu shíhou tǐng xiǎng gēn tóngshì liáotiān de.", zhK:"스 아, 여우 스허우 팅 샹 껀 퉁스 랴오톈 더.", ko:"응, 가끔 동료들이랑 수다 떨던 게 그리워."});
L4("So what would be the ideal situation for you?", {enK:"쏘 왓 우드 비 디 아이디얼 시추에이션 포 유?", ja:"じゃあ、君にとって理想的な働き方は？", jaR:"じゃあ、きみにとってりそうてきなはたらきかたは？", jaK:"자아, 기미니 돗테 리소테키나 하타라키카타와?", zh:"那对你来说，理想的方式是什么？", py:"Nà duì nǐ lái shuō, lǐxiǎng de fāngshì shì shénme?", zhK:"나 두이 니 라이 숴, 리샹 더 팡스 스 선머?", ko:"그럼 너한테 이상적인 방식은 뭐야?"});
L4("A hybrid model would be ideal, like going to the office two days a week.", {enK:"어 하이브리드 마들 우드 비 아이디얼, 라이크 고잉 투 디 오피스 투 데이즈 어 위크.", ja:"週2日オフィスに行くような、ハイブリッド型が理想かな。", jaR:"しゅうふつかオフィスにいくような、ハイブリッドがたがりそうかな。", jaK:"슈 후쓰카 오피스니 이쿠 요나, 하이부릿도가타가 리소카나.", zh:"混合模式最理想，比如一周去两天办公室。", py:"Hùnhé móshì zuì lǐxiǎng, bǐrú yì zhōu qù liǎng tiān bàngōngshì.", zhK:"훈허 모스 쭈이 리샹, 비루 이 저우 취 량 톈 빤궁스.", ko:"일주일에 이틀 사무실에 나가는 식의 하이브리드가 이상적일 것 같아."});
L4("That sounds like the best of both worlds.", {enK:"댓 사운즈 라이크 더 베스트 오브 보쓰 월즈.", ja:"それっていいとこ取りだね。", jaR:"それっていいとこどりだね。", jaK:"소렛테 이이토코도리다네.", zh:"听起来两全其美啊。", py:"Tīng qǐlái liǎngquán-qíměi a.", zhK:"팅 치라이 량취안치메이 아.", ko:"그거 양쪽의 장점만 모은 거네."});
L4("Exactly. I couldn't agree more.", {enK:"이그잭틀리. 아이 쿠든트 어그리 모어.", ja:"そのとおり。まったく同感だよ。", jaR:"そのとおり。まったくどうかんだよ。", jaK:"소노 토오리. 맛타쿠 도칸다요.", zh:"没错。我完全同意。", py:"Méi cuò. Wǒ wánquán tóngyì.", zhK:"메이 춰. 워 완취안 퉁이.", ko:"바로 그거야. 완전 동의해."});
/* b1a */
L4("Hello, you must be the new team member. Welcome!", {enK:"헬로우, 유 머스트 비 더 뉴 팀 멤버. 웰컴!", ja:"こんにちは、新しく入った方ですね。ようこそ！", jaR:"こんにちは、あたらしくはいったかたですね。ようこそ！", jaK:"곤니치와, 아타라시쿠 하잇타 가타데스네. 요코소!", zh:"你好，你一定是新来的同事吧。欢迎！", py:"Nǐ hǎo, nǐ yídìng shì xīn lái de tóngshì ba. Huānyíng!", zhK:"니하오, 니 이딩 스 신 라이 더 퉁스 바. 환잉!", ko:"안녕하세요, 새로 오신 분이군요. 환영해요!"});
L4("Thank you. I'm Jisu, and I'm on the marketing team.", {enK:"땡큐. 아임 지수, 앤 아임 온 더 마케팅 팀.", ja:"ありがとうございます。マーケティングチームのジスです。", jaK:"아리가토 고자이마스. 마케팅구 치무노 지스데스.", zh:"谢谢。我叫智秀，在市场部工作。", py:"Xièxie. Wǒ jiào Zhìxiù, zài shìchǎngbù gōngzuò.", zhK:"셰셰. 워 자오 즈슈, 짜이 스창부 꿍쭤.", ko:"감사합니다. 저는 지수이고, 마케팅팀이에요."});
L4("Nice to meet you, Jisu. I'm David from sales.", {enK:"나이스 투 밋 유, 지수. 아임 데이비드 프롬 세일즈.", ja:"はじめまして、ジスさん。営業部のデイビッドです。", jaR:"はじめまして、ジスさん。えいぎょうぶのデイビッドです。", jaK:"하지메마시테, 지스상. 에이교부노 데이빗도데스.", zh:"很高兴认识你，智秀。我是销售部的大卫。", py:"Hěn gāoxìng rènshi nǐ, Zhìxiù. Wǒ shì xiāoshòubù de Dàwèi.", zhK:"헌 까오싱 런스 니, 즈슈. 워 스 샤오서우부 더 다웨이.", ko:"반가워요, 지수 씨. 저는 영업팀 데이비드예요."});
L4("Nice to meet you too, David.", {enK:"나이스 투 밋 유 투, 데이비드.", ja:"こちらこそ、よろしくお願いします、デイビッドさん。", jaR:"こちらこそ、よろしくおねがいします、デイビッドさん。", jaK:"고치라코소, 요로시쿠 오네가이시마스, 데이빗도상.", zh:"我也很高兴认识你，大卫。", py:"Wǒ yě hěn gāoxìng rènshi nǐ, Dàwèi.", zhK:"워 예 헌 까오싱 런스 니, 다웨이.", ko:"저도 만나서 반가워요, 데이비드."});
L4("Is this your first job?", {enK:"이즈 디스 유어 퍼스트 잡?", ja:"ここが初めての職場ですか？", jaR:"ここがはじめてのしょくばですか？", jaK:"고코가 하지메테노 쇼쿠바데스카?", zh:"这是你的第一份工作吗？", py:"Zhè shì nǐ de dì yī fèn gōngzuò ma?", zhK:"쩌 스 니 더 디 이 펀 꿍쭤 마?", ko:"여기가 첫 직장이에요?"});
L4("No, I worked at an advertising company for three years.", {enK:"노, 아이 웍트 앳 언 애드버타이징 컴퍼니 포 쓰리 이어즈.", ja:"いいえ、広告会社で3年働いていました。", jaR:"いいえ、こうこくがいしゃでさんねんはたらいていました。", jaK:"이이에, 고코쿠가이샤데 산넨 하타라이테 이마시타.", zh:"不是，我在一家广告公司工作过三年。", py:"Bú shì, wǒ zài yì jiā guǎnggào gōngsī gōngzuòguo sān nián.", zhK:"부 스, 워 짜이 이 자 광가오 꿍쓰 꿍쭤궈 싼 녠.", ko:"아니요, 광고 회사에서 3년 일했어요."});
L4("Great. If you have any questions, just ask me.", {enK:"그레잇. 이프 유 해브 애니 퀘스천즈, 저스트 애스크 미.", ja:"いいですね。何か質問があれば、遠慮なく聞いてください。", jaR:"いいですね。なにかしつもんがあれば、えんりょなくきいてください。", jaK:"이이데스네. 나니카 시쓰몬가 아레바, 엔료나쿠 기이테 쿠다사이.", zh:"太好了。有什么问题尽管问我。", py:"Tài hǎo le. Yǒu shénme wèntí jǐnguǎn wèn wǒ.", zhK:"타이 하오 러. 여우 선머 원티 진관 원 워.", ko:"좋네요. 궁금한 거 있으면 언제든 물어보세요."});
L4("Thanks. Where is the meeting room?", {enK:"땡스. 웨어 이즈 더 미팅 룸?", ja:"ありがとうございます。会議室はどこですか？", jaR:"ありがとうございます。かいぎしつはどこですか？", jaK:"아리가토 고자이마스. 가이기시쓰와 도코데스카?", zh:"谢谢。会议室在哪儿？", py:"Xièxie. Huìyìshì zài nǎr?", zhK:"셰셰. 후이이스 짜이 날?", ko:"고마워요. 회의실은 어디예요?"});
L4("It's on the third floor, next to the elevator.", {enK:"잇츠 온 더 써드 플로어, 넥스트 투 디 엘리베이터.", ja:"3階のエレベーターの隣です。", jaR:"さんがいのエレベーターのとなりです。", jaK:"산가이노 에레베타노 도나리데스.", zh:"在三楼，电梯旁边。", py:"Zài sān lóu, diàntī pángbiān.", zhK:"짜이 싼 러우, 뎬티 팡볜.", ko:"3층 엘리베이터 옆이에요."});
L4("Thank you for letting me know.", {enK:"땡큐 포 레팅 미 노우.", ja:"教えてくださってありがとうございます。", jaR:"おしえてくださってありがとうございます。", jaK:"오시에테 구다삿테 아리가토 고자이마스.", zh:"谢谢你告诉我。", py:"Xièxie nǐ gàosu wǒ.", zhK:"셰셰 니 까오쑤 워.", ko:"알려 주셔서 감사해요."});
/* b1b */
L4("Hello, may I speak to Ms. Park?", {enK:"헬로우, 메이 아이 스픽 투 미즈 팍?", ja:"もしもし、パクさんはいらっしゃいますか？", jaK:"모시모시, 파쿠상와 이랏샤이마스카?", zh:"喂，请问朴女士在吗？", py:"Wéi, qǐngwèn Piáo nǚshì zài ma?", zhK:"웨이, 칭원 퍄오 뉘스 짜이 마?", ko:"여보세요, 박 팀장님과 통화할 수 있을까요?"});
L4("I'm sorry, she's not here right now.", {enK:"아임 쏘리, 쉬즈 낫 히어 라잇 나우.", ja:"申し訳ありません、ただいま席を外しております。", jaR:"もうしわけありません、ただいませきをはずしております。", jaK:"모시와케 아리마센, 다다이마 세키오 하즈시테 오리마스.", zh:"不好意思，她现在不在。", py:"Bù hǎoyìsi, tā xiànzài bú zài.", zhK:"뿌 하오이쓰, 타 셴짜이 부 짜이.", ko:"죄송하지만 지금 자리에 안 계세요."});
L4("When will she be back?", {enK:"웬 윌 쉬 비 백?", ja:"いつお戻りになりますか？", jaR:"いつおもどりになりますか？", jaK:"이쓰 오모도리니 나리마스카?", zh:"她什么时候回来？", py:"Tā shénme shíhou huílái?", zhK:"타 선머 스허우 후이라이?", ko:"언제 돌아오시나요?"});
L4("She'll be back around three p.m.", {enK:"쉴 비 백 어라운드 쓰리 피엠.", ja:"午後3時ごろ戻る予定です。", jaR:"ごごさんじごろもどるよていです。", jaK:"고고 산지고로 모도루 요테이데스.", zh:"她下午三点左右回来。", py:"Tā xiàwǔ sān diǎn zuǒyòu huílái.", zhK:"타 샤우 싼 뎬 쭤유 후이라이.", ko:"오후 3시쯤 돌아오실 거예요."});
L4("I see. Can I leave a message?", {enK:"아이 씨. 캔 아이 리브 어 메시지?", ja:"そうですか。伝言をお願いできますか？", jaR:"そうですか。でんごんをおねがいできますか？", jaK:"소데스카. 덴곤오 오네가이 데키마스카?", zh:"我知道了。我可以留个言吗？", py:"Wǒ zhīdào le. Wǒ kěyǐ liú ge yán ma?", zhK:"워 즈다오 러. 워 커이 류 거 옌 마?", ko:"그렇군요. 메시지 남겨도 될까요?"});
L4("Sure. May I have your name, please?", {enK:"슈어. 메이 아이 해브 유어 네임, 플리즈?", ja:"かしこまりました。お名前をお伺いしてもよろしいですか？", jaR:"かしこまりました。おなまえをおうかがいしてもよろしいですか？", jaK:"가시코마리마시타. 오나마에오 오우카가이시테모 요로시이데스카?", zh:"当然可以。请问您贵姓？", py:"Dāngrán kěyǐ. Qǐngwèn nín guìxìng?", zhK:"당란 커이. 칭원 닌 꾸이싱?", ko:"물론이죠. 성함을 여쭤봐도 될까요?"});
L4("It's John Miller from ABC Company.", {enK:"잇츠 존 밀러 프롬 에이비씨 컴퍼니.", ja:"ABC社のジョン・ミラーです。", jaR:"エービーシーしゃのジョン・ミラーです。", jaK:"에비시샤노 존 미라데스.", zh:"我是ABC公司的约翰·米勒。", py:"Wǒ shì ABC gōngsī de Yuēhàn Mǐlè.", zhK:"워 스 에이비씨 꿍쓰 더 웨한 미러.", ko:"ABC 컴퍼니의 존 밀러입니다."});
L4("Could I have your phone number, please?", {enK:"쿠다이 해브 유어 폰 넘버, 플리즈?", ja:"お電話番号を教えていただけますか？", jaR:"おでんわばんごうをおしえていただけますか？", jaK:"오덴와 방고오 오시에테 이타다케마스카?", zh:"能告诉我您的电话号码吗？", py:"Néng gàosu wǒ nín de diànhuà hàomǎ ma?", zhK:"넝 까오쑤 워 닌 더 뎬화 하오마 마?", ko:"전화번호를 알려 주시겠어요?"});
L4("It's 555-1234. Please ask her to call me back.", {enK:"잇츠 파이브 파이브 파이브, 원 투 쓰리 포. 플리즈 애스크 허 투 콜 미 백.", ja:"555-1234です。折り返しお電話いただけるようお伝えください。", jaR:"ごーごーごーのいちにさんよんです。おりかえしおでんわいただけるようおつたえください。", jaK:"고고고노 이치니산욘데스. 오리카에시 오덴와 이타다케루요 오쓰타에 쿠다사이.", zh:"我的电话是555-1234。请让她给我回个电话。", py:"Wǒ de diànhuà shì wǔ wǔ wǔ yāo èr sān sì. Qǐng ràng tā gěi wǒ huí ge diànhuà.", zhK:"워 더 뎬화 스 우 우 우 야오 얼 싼 쓰. 칭 랑 타 게이 워 후이 거 뎬화.", ko:"555-1234예요. 다시 전화 달라고 전해 주세요."});
L4("I'll make sure she gets your message.", {enK:"아일 메이크 슈어 쉬 겟츠 유어 메시지.", ja:"必ずお伝えします。", jaR:"かならずおつたえします。", jaK:"가나라즈 오쓰타에 시마스.", zh:"我一定会转告她的。", py:"Wǒ yídìng huì zhuǎngào tā de.", zhK:"워 이딩 후이 좐가오 타 더.", ko:"메시지 꼭 전해 드릴게요."});
/* b2a */
L4("Hi, I'd like to set up a meeting to discuss the new project.", {enK:"하이, 아이드 라이크 투 셋 업 어 미팅 투 디스커스 더 뉴 프라젝트.", ja:"こんにちは、新しいプロジェクトについて話し合う会議を設定したいのですが。", jaR:"こんにちは、あたらしいプロジェクトについてはなしあうかいぎをせっていしたいのですが。", jaK:"곤니치와, 아타라시이 푸로젝토니 쓰이테 하나시아우 가이기오 셋테이 시타이노데스가.", zh:"你好，我想安排一次会议，讨论一下新项目。", py:"Nǐ hǎo, wǒ xiǎng ānpái yí cì huìyì, tǎolùn yíxià xīn xiàngmù.", zhK:"니하오, 워 샹 안파이 이 츠 후이이, 타오룬 이샤 신 샹무.", ko:"안녕하세요, 새 프로젝트 논의를 위해 회의를 잡고 싶어요."});
L4("Sure. When would be convenient for you?", {enK:"슈어. 웬 우드 비 컨비니언트 포 유?", ja:"いいですよ。いつがご都合よろしいですか？", jaR:"いいですよ。いつがごつごうよろしいですか？", jaK:"이이데스요. 이쓰가 고쓰고 요로시이데스카?", zh:"好的。您什么时候方便？", py:"Hǎo de. Nín shénme shíhou fāngbiàn?", zhK:"하오 더. 닌 선머 스허우 팡볜?", ko:"좋아요. 언제가 편하세요?"});
L4("How about Tuesday afternoon?", {enK:"하우 어바웃 튜즈데이 애프터눈?", ja:"火曜日の午後はいかがですか？", jaR:"かようびのごごはいかがですか？", jaK:"가요비노 고고와 이카가데스카?", zh:"星期二下午怎么样？", py:"Xīngqī'èr xiàwǔ zěnmeyàng?", zhK:"싱치얼 샤우 쩐머양?", ko:"화요일 오후 어떠세요?"});
L4("I'm afraid I'm busy on Tuesday. How about Wednesday morning?", {enK:"아임 어프레이드 아임 비지 온 튜즈데이. 하우 어바웃 웬즈데이 모닝?", ja:"あいにく火曜日は忙しいんです。水曜日の午前はいかがですか？", jaR:"あいにくかようびはいそがしいんです。すいようびのごぜんはいかがですか？", jaK:"아이니쿠 가요비와 이소가시인데스. 스이요비노 고젠와 이카가데스카?", zh:"不好意思，我星期二很忙。星期三上午怎么样？", py:"Bù hǎoyìsi, wǒ xīngqī'èr hěn máng. Xīngqīsān shàngwǔ zěnmeyàng?", zhK:"뿌 하오이쓰, 워 싱치얼 헌 망. 싱치싼 상우 쩐머양?", ko:"죄송하지만 화요일은 바빠요. 수요일 오전은 어떠세요?"});
L4("Wednesday at 10 works for me.", {enK:"웬즈데이 앳 텐 웍스 포 미.", ja:"水曜日の10時なら大丈夫です。", jaR:"すいようびのじゅうじならだいじょうぶです。", jaK:"스이요비노 주지나라 다이조부데스.", zh:"星期三十点我可以。", py:"Xīngqīsān shí diǎn wǒ kěyǐ.", zhK:"싱치싼 스 뎬 워 커이.", ko:"수요일 10시 좋아요."});
L4("Great. I'll book a meeting room.", {enK:"그레잇. 아일 북 어 미팅 룸.", ja:"よかったです。会議室を予約しておきます。", jaR:"よかったです。かいぎしつをよやくしておきます。", jaK:"요캇타데스. 가이기시쓰오 요야쿠시테 오키마스.", zh:"太好了。我来订会议室。", py:"Tài hǎo le. Wǒ lái dìng huìyìshì.", zhK:"타이 하오 러. 워 라이 딩 후이이스.", ko:"좋아요. 제가 회의실을 예약할게요."});
L4("Should I prepare anything for the meeting?", {enK:"슈드 아이 프리페어 애니씽 포 더 미팅?", ja:"会議のために何か準備しておくものはありますか？", jaR:"かいぎのためになにかじゅんびしておくものはありますか？", jaK:"가이기노 다메니 나니카 준비시테 오쿠 모노와 아리마스카?", zh:"开会需要我准备什么吗？", py:"Kāihuì xūyào wǒ zhǔnbèi shénme ma?", zhK:"카이후이 쉬야오 워 준베이 선머 마?", ko:"회의 전에 준비할 게 있을까요?"});
L4("Could you bring the latest sales report?", {enK:"쿠쥬 브링 더 레이티스트 세일즈 리포트?", ja:"最新の売上報告書を持ってきていただけますか？", jaR:"さいしんのうりあげほうこくしょをもってきていただけますか？", jaK:"사이신노 우리아게 호코쿠쇼오 못테키테 이타다케마스카?", zh:"你能带上最新的销售报告吗？", py:"Nǐ néng dàishang zuìxīn de xiāoshòu bàogào ma?", zhK:"니 넝 다이상 쭈이신 더 샤오서우 빠오가오 마?", ko:"최근 판매 보고서를 가져와 주시겠어요?"});
L4("Sure. I'll send you a calendar invite too.", {enK:"슈어. 아일 센드 유 어 캘린더 인바이트 투.", ja:"わかりました。カレンダーの招待もお送りします。", jaR:"わかりました。カレンダーのしょうたいもおおくりします。", jaK:"와카리마시타. 가렌다노 쇼타이모 오오쿠리시마스.", zh:"好的。我也会给你发个日历邀请。", py:"Hǎo de. Wǒ yě huì gěi nǐ fā ge rìlì yāoqǐng.", zhK:"하오 더. 워 예 후이 게이 니 파 거 르리 야오칭.", ko:"네. 캘린더 초대도 보내 드릴게요."});
L4("Thanks. See you on Wednesday.", {enK:"땡스. 씨 유 온 웬즈데이.", ja:"ありがとうございます。では水曜日に。", jaR:"ありがとうございます。ではすいようびに。", jaK:"아리가토 고자이마스. 데와 스이요비니.", zh:"谢谢。星期三见。", py:"Xièxie. Xīngqīsān jiàn.", zhK:"셰셰. 싱치싼 젠.", ko:"고마워요. 수요일에 봬요."});
/* b2b */
L4("Hi, I'm calling because our order hasn't arrived yet.", {enK:"하이, 아임 콜링 비코즈 아워 오더 해즌트 어라이브드 옛.", ja:"もしもし、注文した品物がまだ届いていないのでお電話しました。", jaR:"もしもし、ちゅうもんしたしなものがまだとどいていないのでおでんわしました。", jaK:"모시모시, 주몬시타 시나모노가 마다 도도이테 이나이노데 오덴와 시마시타.", zh:"你好，我打电话是因为我们订的货还没到。", py:"Nǐ hǎo, wǒ dǎ diànhuà shì yīnwèi wǒmen dìng de huò hái méi dào.", zhK:"니하오, 워 다 뎬화 스 인웨이 워먼 딩 더 훠 하이 메이 다오.", ko:"안녕하세요, 주문한 물건이 아직 안 와서 전화했어요."});
L4("I'm sorry for the inconvenience. Could I have your order number?", {enK:"아임 쏘리 포 디 인컨비니언스. 쿠다이 해브 유어 오더 넘버?", ja:"ご不便をおかけして申し訳ありません。注文番号を教えていただけますか？", jaR:"ごふべんをおかけしてもうしわけありません。ちゅうもんばんごうをおしえていただけますか？", jaK:"고후벤오 오카케시테 모시와케 아리마센. 주몬 방고오 오시에테 이타다케마스카?", zh:"给您带来不便，非常抱歉。能告诉我订单号吗？", py:"Gěi nín dàilái búbiàn, fēicháng bàoqiàn. Néng gàosu wǒ dìngdānhào ma?", zhK:"게이 닌 다이라이 부볜, 페이창 바오첸. 넝 까오쑤 워 딩단하오 마?", ko:"불편을 드려 죄송합니다. 주문번호를 알려 주시겠어요?"});
L4("Sure, it's A-2045.", {enK:"슈어, 잇츠 에이 투 오 포 파이브.", ja:"はい、A-2045です。", jaR:"はい、エーにーぜろよんごーです。", jaK:"하이, 에- 니 제로 욘 고데스.", zh:"好的，是A-2045。", py:"Hǎo de, shì A èr líng sì wǔ.", zhK:"하오 더, 스 에이 얼 링 쓰 우.", ko:"네, A-2045예요."});
L4("Let me check that for you. One moment, please.", {enK:"렛 미 체크 댓 포 유. 원 모먼트, 플리즈.", ja:"お調べします。少々お待ちください。", jaR:"おしらべします。しょうしょうおまちください。", jaK:"오시라베시마스. 쇼쇼 오마치 쿠다사이.", zh:"我帮您查一下。请稍等。", py:"Wǒ bāng nín chá yíxià. Qǐng shāo děng.", zhK:"워 방 닌 차 이샤. 칭 사오 덩.", ko:"확인해 드릴게요. 잠시만 기다려 주세요."});
L4("Okay, thank you.", {enK:"오케이, 땡큐.", ja:"はい、ありがとうございます。", jaK:"하이, 아리가토 고자이마스.", zh:"好的，谢谢。", py:"Hǎo de, xièxie.", zhK:"하오 더, 셰셰.", ko:"네, 감사합니다."});
L4("It looks like the delivery was delayed because of the weather.", {enK:"잇 룩스 라이크 더 딜리버리 워즈 딜레이드 비코즈 오브 더 웨더.", ja:"天候の影響で配送が遅れているようです。", jaR:"てんこうのえいきょうではいそうがおくれているようです。", jaK:"덴코노 에이쿄데 하이소가 오쿠레테 이루 요데스.", zh:"看起来是因为天气原因，配送延误了。", py:"Kàn qǐlái shì yīnwèi tiānqì yuányīn, pèisòng yánwù le.", zhK:"칸 치라이 스 인웨이 톈치 위안인, 페이쑹 옌우 러.", ko:"날씨 때문에 배송이 늦어진 것 같아요."});
L4("I see. When can we expect it?", {enK:"아이 씨. 웬 캔 위 익스펙트 잇?", ja:"そうですか。いつごろ届きますか？", jaR:"そうですか。いつごろとどきますか？", jaK:"소데스카. 이쓰고로 도도키마스카?", zh:"我明白了。我们什么时候能收到？", py:"Wǒ míngbai le. Wǒmen shénme shíhou néng shōudào?", zhK:"워 밍바이 러. 워먼 선머 스허우 넝 서우다오?", ko:"그렇군요. 언제쯤 받을 수 있을까요?"});
L4("It should arrive by Friday.", {enK:"잇 슈드 어라이브 바이 프라이데이.", ja:"金曜日までには届くはずです。", jaR:"きんようびまでにはとどくはずです。", jaK:"긴요비마데니와 도도쿠 하즈데스.", zh:"星期五之前应该能到。", py:"Xīngqīwǔ zhīqián yīnggāi néng dào.", zhK:"싱치우 즈첸 잉가이 넝 다오.", ko:"금요일까지는 도착할 거예요."});
L4("Alright. Please let me know if there are any changes.", {enK:"올라잇. 플리즈 렛 미 노우 이프 데어 아 애니 체인지즈.", ja:"わかりました。何か変更があれば教えてください。", jaR:"わかりました。なにかへんこうがあればおしえてください。", jaK:"와카리마시타. 나니카 헨코가 아레바 오시에테 쿠다사이.", zh:"好的。如果有什么变化，请告诉我。", py:"Hǎo de. Rúguǒ yǒu shénme biànhuà, qǐng gàosu wǒ.", zhK:"하오 더. 루궈 여우 선머 볜화, 칭 까오쑤 워.", ko:"알겠어요. 변경 사항 있으면 알려 주세요."});
L4("Of course. I'll send you an update by email.", {enK:"오브 코스. 아일 센드 유 언 업데이트 바이 이메일.", ja:"もちろんです。最新の状況をメールでお送りします。", jaR:"もちろんです。さいしんのじょうきょうをメールでおおくりします。", jaK:"모치론데스. 사이신노 조쿄오 메루데 오오쿠리시마스.", zh:"当然。我会通过邮件告诉您最新情况。", py:"Dāngrán. Wǒ huì tōngguò yóujiàn gàosu nín zuìxīn qíngkuàng.", zhK:"당란. 워 후이 퉁궈 여우젠 까오쑤 닌 쭈이신 칭쾅.", ko:"물론이죠. 진행 상황은 이메일로 보내 드릴게요."});
/* b3a */
L4("We've reviewed your proposal, but the price is higher than we expected.", {enK:"위브 리뷰드 유어 프러포절, 벗 더 프라이스 이즈 하이어 댄 위 익스펙티드.", ja:"ご提案を検討しましたが、価格が予想より高いですね。", jaR:"ごていあんをけんとうしましたが、かかくがよそうよりたかいですね。", jaK:"고테이안오 겐토 시마시타가, 가카쿠가 요소요리 다카이데스네.", zh:"我们看过你们的方案了，但价格比我们预想的要高。", py:"Wǒmen kànguo nǐmen de fāng'àn le, dàn jiàgé bǐ wǒmen yùxiǎng de yào gāo.", zhK:"워먼 칸궈 니먼 더 팡안 러, 단 자거 비 워먼 위샹 더 야오 까오.", ko:"제안서를 검토했는데, 가격이 예상보다 높네요."});
L4("I understand. However, our product offers higher quality than our competitors'.", {enK:"아이 언더스탠드. 하우에버, 아워 프라덕트 오퍼즈 하이어 퀄리티 댄 아워 컴페티터즈.", ja:"おっしゃることはわかります。ですが、当社の製品は競合他社より品質が高いです。", jaR:"おっしゃることはわかります。ですが、とうしゃのせいひんはきょうごうたしゃよりひんしつがたかいです。", jaK:"옷샤루 고토와 와카리마스. 데스가, 도샤노 세이힌와 교고 타샤요리 힌시쓰가 다카이데스.", zh:"我理解。不过，我们产品的质量比竞争对手的更好。", py:"Wǒ lǐjiě. Búguò, wǒmen chǎnpǐn de zhìliàng bǐ jìngzhēng duìshǒu de gèng hǎo.", zhK:"워 리제. 부궈, 워먼 찬핀 더 즈량 비 징정 두이서우 더 껑 하오.", ko:"이해합니다. 하지만 저희 제품은 경쟁사 제품보다 품질이 더 좋습니다."});
L4("That may be true, but we have a limited budget this year.", {enK:"댓 메이 비 트루, 벗 위 해브 어 리미티드 버짓 디스 이어.", ja:"そうかもしれませんが、今年は予算が限られているんです。", jaR:"そうかもしれませんが、ことしはよさんがかぎられているんです。", jaK:"소카모 시레마셍가, 고토시와 요산가 가기라레테 이룬데스.", zh:"也许是这样，但我们今年的预算有限。", py:"Yěxǔ shì zhèyàng, dàn wǒmen jīnnián de yùsuàn yǒuxiàn.", zhK:"예쉬 스 쩌양, 단 워먼 진녠 더 위쏸 여우셴.", ko:"그럴 수도 있지만 올해 예산이 한정돼 있어요."});
L4("If you place a large order, we can offer a ten percent discount.", {enK:"이프 유 플레이스 어 라지 오더, 위 캔 오퍼 어 텐 퍼센트 디스카운트.", ja:"大口のご注文でしたら、10パーセントの割引をご提供できます。", jaR:"おおぐちのごちゅうもんでしたら、じゅっパーセントのわりびきをごていきょうできます。", jaK:"오구치노 고주몬데시타라, 짓파센토노 와리비키오 고테이쿄 데키마스.", zh:"如果你们大量订购，我们可以打九折。", py:"Rúguǒ nǐmen dàliàng dìnggòu, wǒmen kěyǐ dǎ jiǔ zhé.", zhK:"루궈 니먼 다량 딩거우, 워먼 커이 다 지우 저.", ko:"대량으로 주문하시면 10% 할인해 드릴 수 있습니다."});
L4("How large would the order need to be?", {enK:"하우 라지 우드 디 오더 니드 투 비?", ja:"どのくらいの量を注文すればいいですか？", jaR:"どのくらいのりょうをちゅうもんすればいいですか？", jaK:"도노쿠라이노 료오 주몬스레바 이이데스카?", zh:"需要订多少才行？", py:"Xūyào dìng duōshao cái xíng?", zhK:"쉬야오 딩 둬사오 차이 싱?", ko:"주문량이 얼마나 돼야 하죠?"});
L4("At least five hundred units.", {enK:"앳 리스트 파이브 헌드레드 유닛츠.", ja:"最低500個です。", jaR:"さいていごひゃっこです。", jaK:"사이테이 고햣코데스.", zh:"至少五百件。", py:"Zhìshǎo wǔbǎi jiàn.", zhK:"즈사오 우바이 젠.", ko:"최소 500개입니다."});
L4("Hmm, could you include free shipping as well?", {enK:"흠, 쿠쥬 인클루드 프리 쉬핑 애즈 웰?", ja:"うーん、送料無料もつけていただけますか？", jaR:"うーん、そうりょうむりょうもつけていただけますか？", jaK:"우웅, 소료 무료모 쓰케테 이타다케마스카?", zh:"嗯，能不能再加上免运费？", py:"Ńg, néng bu néng zài jiāshang miǎn yùnfèi?", zhK:"응, 넝 부 넝 짜이 자상 몐 윈페이?", ko:"음, 무료 배송도 포함해 줄 수 있나요?"});
L4("We could consider that if you sign a long-term contract.", {enK:"위 쿠드 컨시더 댓 이프 유 사인 어 롱텀 컨트랙트.", ja:"長期契約を結んでいただけるなら、検討できます。", jaR:"ちょうきけいやくをむすんでいただけるなら、けんとうできます。", jaK:"조키 게이야쿠오 무슨데 이타다케루나라, 겐토 데키마스.", zh:"如果你们签长期合同，我们可以考虑。", py:"Rúguǒ nǐmen qiān chángqī hétong, wǒmen kěyǐ kǎolǜ.", zhK:"루궈 니먼 첸 창치 허퉁, 워먼 커이 카오뤼.", ko:"장기 계약을 맺으시면 고려해 볼 수 있습니다."});
L4("That sounds reasonable. Let me discuss it with my team.", {enK:"댓 사운즈 리즈너블. 렛 미 디스커스 잇 위드 마이 팀.", ja:"それは妥当ですね。チームと相談してみます。", jaR:"それはだとうですね。チームとそうだんしてみます。", jaK:"소레와 다토데스네. 치무토 소단시테 미마스.", zh:"听起来很合理。我跟团队商量一下。", py:"Tīng qǐlái hěn hélǐ. Wǒ gēn tuánduì shāngliang yíxià.", zhK:"팅 치라이 헌 허리. 워 껀 퇀두이 상량 이샤.", ko:"합리적이네요. 팀과 논의해 볼게요."});
L4("Sounds good. I look forward to hearing from you by the end of the week.", {enK:"사운즈 굿. 아이 룩 포워드 투 히어링 프롬 유 바이 디 엔드 오브 더 위크.", ja:"わかりました。今週中にお返事をいただけるのをお待ちしています。", jaR:"わかりました。こんしゅうちゅうにおへんじをいただけるのをおまちしています。", jaK:"와카리마시타. 곤슈추니 오헨지오 이타다케루노오 오마치시테 이마스.", zh:"好的。期待本周之内收到您的回复。", py:"Hǎo de. Qīdài běn zhōu zhī nèi shōudào nín de huífù.", zhK:"하오 더. 치다이 번 저우 즈 네이 서우다오 닌 더 후이푸.", ko:"좋습니다. 이번 주 안에 연락 주시길 기다리겠습니다."});

L4("Thank you for the presentation. Could you explain why sales dropped in the third quarter?", {enK:"땡큐 포 더 프레젠테이션. 쿠쥬 익스플레인 와이 세일즈 드랍트 인 더 써드 쿼터?", ja:"ご発表ありがとうございました。第3四半期に売上が落ちた理由を説明していただけますか？", jaR:"ごはっぴょうありがとうございました。だいさんしはんきにうりあげがおちたりゆうをせつめいしていただけますか？", jaK:"고핫표 아리가토 고자이마시타. 다이산 시한키니 우리아게가 오치타 리유오 세쓰메이시테 이타다케마스카?", zh:"感谢您的报告。能解释一下第三季度销售额为什么下降了吗？", py:"Gǎnxiè nín de bàogào. Néng jiěshì yíxià dì sān jìdù xiāoshòu'é wèishénme xiàjiàng le ma?", zhK:"간셰 닌 더 빠오가오. 넝 제스 이샤 디 싼 지두 샤오서우어 웨이선머 샤장 러 마?", ko:"발표 감사합니다. 3분기에 매출이 떨어진 이유를 설명해 주시겠어요?"});
L4("That's a good question. It was mainly due to rising material costs.", {enK:"댓츠 어 굿 퀘스천. 잇 워즈 메인리 듀 투 라이징 머티리얼 코스츠.", ja:"いい質問ですね。主に原材料費の上昇によるものです。", jaR:"いいしつもんですね。おもにげんざいりょうひのじょうしょうによるものです。", jaK:"이이 시쓰몬데스네. 오모니 겐자이료히노 조쇼니 요루 모노데스.", zh:"这是个好问题。主要是因为原材料成本上涨。", py:"Zhè shì ge hǎo wèntí. Zhǔyào shì yīnwèi yuáncáiliào chéngběn shàngzhǎng.", zhK:"쩌 스 거 하오 원티. 주야오 스 인웨이 위안차이랴오 청번 상장.", ko:"좋은 질문입니다. 주로 원자재 비용이 올랐기 때문입니다."});
L4("And what steps are you taking to address that?", {enK:"앤 왓 스텝스 아 유 테이킹 투 어드레스 댓?", ja:"それに対して、どのような対策を取っていますか？", jaR:"それにたいして、どのようなたいさくをとっていますか？", jaK:"소레니 다이시테, 도노요나 다이사쿠오 돗테 이마스카?", zh:"那你们正在采取什么措施来解决这个问题？", py:"Nà nǐmen zhèngzài cǎiqǔ shénme cuòshī lái jiějué zhège wèntí?", zhK:"나 니먼 정짜이 차이취 선머 춰스 라이 제줴 쩌거 원티?", ko:"그 문제를 해결하려고 어떤 조치를 하고 있나요?"});
L4("We're currently negotiating with new suppliers.", {enK:"위어 커런틀리 니고시에이팅 위드 뉴 서플라이어즈.", ja:"現在、新しい仕入れ先と交渉中です。", jaR:"げんざい、あたらしいしいれさきとこうしょうちゅうです。", jaK:"겐자이, 아타라시이 시이레사키토 고쇼추데스.", zh:"我们目前正在和新的供应商谈判。", py:"Wǒmen mùqián zhèngzài hé xīn de gōngyìngshāng tánpàn.", zhK:"워먼 무첸 정짜이 허 신 더 꿍잉상 탄판.", ko:"현재 새 공급업체들과 협상 중입니다."});
L4("When do you expect to see results?", {enK:"웬 두 유 익스펙트 투 씨 리절츠?", ja:"いつごろ成果が出る見込みですか？", jaR:"いつごろせいかがでるみこみですか？", jaK:"이쓰고로 세이카가 데루 미코미데스카?", zh:"你们预计什么时候能看到成效？", py:"Nǐmen yùjì shénme shíhou néng kàndào chéngxiào?", zhK:"니먼 위지 선머 스허우 넝 칸다오 청샤오?", ko:"언제쯤 결과가 나올 것으로 보나요?"});
L4("We expect to see improvements by the first quarter of next year.", {enK:"위 익스펙트 투 씨 임프루브먼츠 바이 더 퍼스트 쿼터 오브 넥스트 이어.", ja:"来年の第1四半期までには改善が見られる見込みです。", jaR:"らいねんのだいいちしはんきまでにはかいぜんがみられるみこみです。", jaK:"라이넨노 다이이치 시한키마데니와 가이젠가 미라레루 미코미데스.", zh:"我们预计到明年第一季度会有所改善。", py:"Wǒmen yùjì dào míngnián dì yī jìdù huì yǒusuǒ gǎishàn.", zhK:"워먼 위지 다오 밍녠 디 이 지두 후이 여우쒀 가이산.", ko:"내년 1분기까지는 개선될 것으로 예상합니다."});
L4("Is there any risk that the plan might not work?", {enK:"이즈 데어 애니 리스크 댓 더 플랜 마잇 낫 웍?", ja:"その計画がうまくいかないリスクはありませんか？", jaR:"そのけいかくがうまくいかないリスクはありませんか？", jaK:"소노 게이카쿠가 우마쿠 이카나이 리스쿠와 아리마센카?", zh:"这个计划有没有可能行不通？", py:"Zhège jìhuà yǒu méiyǒu kěnéng xíng bu tōng?", zhK:"쩌거 지화 여우 메이여우 커넝 싱 부 퉁?", ko:"계획이 실패할 위험은 없나요?"});
L4("There's always some risk, but we have a backup plan.", {enK:"데어즈 올웨이즈 썸 리스크, 벗 위 해브 어 백업 플랜.", ja:"リスクは常にありますが、代替案を用意しています。", jaR:"リスクはつねにありますが、だいたいあんをよういしています。", jaK:"리스쿠와 쓰네니 아리마스가, 다이타이안오 요이시테 이마스.", zh:"风险总是有的，但我们有备用方案。", py:"Fēngxiǎn zǒng shì yǒu de, dàn wǒmen yǒu bèiyòng fāng'àn.", zhK:"펑셴 쭝 스 여우 더, 단 워먼 여우 뻬이융 팡안.", ko:"위험은 늘 어느 정도 있지만, 대비책을 마련해 두었습니다."});
L4("Thank you. That was very clear.", {enK:"땡큐. 댓 워즈 베리 클리어.", ja:"ありがとうございます。とてもわかりやすかったです。", jaK:"아리가토 고자이마스. 도테모 와카리야스캇타데스.", zh:"谢谢。讲得非常清楚。", py:"Xièxie. Jiǎng de fēicháng qīngchu.", zhK:"셰셰. 장 더 페이창 칭추.", ko:"감사합니다. 아주 명확했어요."});
L4("Thank you for your question. Feel free to email me if you have any more questions.", {enK:"땡큐 포 유어 퀘스천. 필 프리 투 이메일 미 이프 유 해브 애니 모어 퀘스천즈.", ja:"ご質問ありがとうございました。ほかにご質問があれば、お気軽にメールしてください。", jaR:"ごしつもんありがとうございました。ほかにごしつもんがあれば、おきがるにメールしてください。", jaK:"고시쓰몬 아리가토 고자이마시타. 호카니 고시쓰몬가 아레바, 오키가루니 메루시테 쿠다사이.", zh:"谢谢您的提问。如果还有其他问题，欢迎随时给我发邮件。", py:"Xièxie nín de tíwèn. Rúguǒ hái yǒu qítā wèntí, huānyíng suíshí gěi wǒ fā yóujiàn.", zhK:"셰셰 닌 더 티원. 루궈 하이 여우 치타 원티, 환잉 쑤이스 게이 워 파 여우젠.", ko:"질문해 주셔서 감사합니다. 더 궁금한 점이 있으시면 편하게 이메일 주세요."});

L4("Good morning. Where are you flying today?", {enK:"굿 모닝. 웨어 아 유 플라잉 투데이?", ja:"おはようございます。本日はどちらまでですか？", jaR:"おはようございます。ほんじつはどちらまでですか？", jaK:"오하요 고자이마스. 혼지쓰와 도치라마데데스카?", zh:"早上好。您今天飞往哪里？", py:"Zǎoshang hǎo. Nín jīntiān fēi wǎng nǎlǐ?", zhK:"자오상 하오. 닌 진톈 페이 왕 나리?", ko:"안녕하세요. 오늘 어디로 가세요?"});

L4("Do you have any bags to check?", {enK:"두 유 해브 애니 백스 투 체크?", ja:"お預けになる荷物はありますか？", jaR:"おあずけになるにもつはありますか？", jaK:"오아즈케니 나루 니모쓰와 아리마스카?", zh:"您有要托运的行李吗？", py:"Nín yǒu yào tuōyùn de xíngli ma?", zhK:"닌 여우 야오 퉈윈 더 싱리 마?", ko:"부칠 짐이 있으세요?"});
L4("Yes, I have one bag.", {enK:"예스, 아이 해브 원 백.", ja:"はい、1つあります。", jaR:"はい、ひとつあります。", jaK:"하이, 히토쓰 아리마스.", zh:"有，我有一件行李。", py:"Yǒu, wǒ yǒu yí jiàn xíngli.", zhK:"여우, 워 여우 이 젠 싱리.", ko:"네, 가방 하나 있어요."});
L4("Would you like a window seat or an aisle seat?", {enK:"우쥬 라이크 어 윈도우 싯 오어 언 아일 싯?", ja:"窓側と通路側、どちらのお席がよろしいですか？", jaR:"まどがわとつうろがわ、どちらのおせきがよろしいですか？", jaK:"마도가와토 쓰로가와, 도치라노 오세키가 요로시이데스카?", zh:"您想要靠窗的座位还是靠过道的座位？", py:"Nín xiǎng yào kào chuāng de zuòwèi háishi kào guòdào de zuòwèi?", zhK:"닌 샹 야오 카오 촹 더 쭤웨이 하이스 카오 궈다오 더 쭤웨이?", ko:"창가 좌석과 통로 좌석 중 어디로 드릴까요?"});
L4("A window seat, please.", {enK:"어 윈도우 싯, 플리즈.", ja:"窓側の席でお願いします。", jaR:"まどがわのせきでおねがいします。", jaK:"마도가와노 세키데 오네가이시마스.", zh:"请给我靠窗的座位。", py:"Qǐng gěi wǒ kào chuāng de zuòwèi.", zhK:"칭 게이 워 카오 촹 더 쭤웨이.", ko:"창가 좌석으로 주세요."});
L4("Here is your boarding pass. Your gate is 23.", {enK:"히어 이즈 유어 보딩 패스. 유어 게잇 이즈 트웬티쓰리.", ja:"こちらが搭乗券です。搭乗口は23番です。", jaR:"こちらがとうじょうけんです。とうじょうぐちはにじゅうさんばんです。", jaK:"고치라가 도조켄데스. 도조구치와 니주산반데스.", zh:"这是您的登机牌。您的登机口是23号。", py:"Zhè shì nín de dēngjīpái. Nín de dēngjīkǒu shì èrshísān hào.", zhK:"쩌 스 닌 더 덩지파이. 닌 더 덩지커우 스 얼스싼 하오.", ko:"탑승권 여기 있습니다. 23번 게이트예요."});
L4("Thank you. What time is boarding?", {enK:"땡큐. 왓 타임 이즈 보딩?", ja:"ありがとうございます。搭乗は何時ですか？", jaR:"ありがとうございます。とうじょうはなんじですか？", jaK:"아리가토 고자이마스. 도조와 난지데스카?", zh:"谢谢。几点登机？", py:"Xièxie. Jǐ diǎn dēngjī?", zhK:"셰셰. 지 뎬 덩지?", ko:"감사합니다. 탑승은 몇 시예요?"});

const NUMS = {"1":"one","2":"two","3":"three","4":"four","5":"five","6":"six","7":"seven","8":"eight","9":"nine","10":"ten","11":"eleven","12":"twelve","15":"fifteen","20":"twenty","23":"twenty three","24":"twenty four","100":"one hundred","500":"five hundred"};
function norm(s){
  s = String(s).toLowerCase().replace(/[’‘`]/g,"'");
  s = s.replace(/\b([ap])\.\s?m\.?/g,"$1m");
  s = s.replace(/(\d+)\s*%/g,"$1 percent");
  s = s.replace(/\bwon't\b/g,"will not").replace(/\bcan't\b/g,"can not").replace(/\bcannot\b/g,"can not")
       .replace(/\blet's\b/g,"let us").replace(/n't\b/g," not").replace(/'m\b/g," am").replace(/'re\b/g," are")
       .replace(/'ve\b/g," have").replace(/'ll\b/g," will").replace(/'d\b/g," would")
       .replace(/\b(he|she|it|that|there|what|where|who|how|here|this)'s\b/g,"$1 is");
  s = s.replace(/\b\d+\b/g, m => NUMS[m] || m);
  s = s.replace(/-/g,"").replace(/[^a-z0-9\s]/g," ").replace(/\s+/g," ").trim();
  return s;
}

 {re:/\b(?:want|wants|wanted|need|needs|would like|like|likes|hope|plan|decide|decided|try|tried) to (\w{5,}ing)\b/, check:m=>!ING_OK.has(m[1]), msg:"to 뒤에는 -ing가 아니라 동사원형이 와요.", ex:"I want to going → I want to go"},
 {re:/\b(?:can|could|will|would|should|must|may|might) to\b/, msg:"조동사(can, will, should 등) 바로 뒤에는 to를 쓰지 않아요.", ex:"I can to help → I can help"},
 {re:/\b(?:can|could|will|would|should|must|may|might|do not|does not|did not|did|does|to|let us) (goes|wants|has|needs|likes|makes|takes|comes|works|went|came|took|bought|ate|saw|made|gave|wanted|liked|needed|worked|arrived|called|helped|was|were|is|are|am)\b/, msg:"조동사·do/does/did·to 뒤에는 동사원형(기본형)을 써요.", ex:"I did not went → I did not go / She can goes → She can go / will is → will be"},
 {re:/\bi (?:is|are|has)\b/, msg:"주어가 I일 때는 am, have를 써요.", ex:"I is → I am / I has → I have"},
 {re:/\b(?:he|she|it) (are|have|do not|want|need|like|go|work|live|know|make|take|come|look|seem|sound|arrive)\b/, check:(m,n)=>!AUX_BEFORE.has(prevWord(n,m.index)), msg:"he/she/it(3인칭 단수) 주어 뒤 현재형 동사에는 -s를 붙이고, be동사는 is, have는 has, do는 does를 써요.", ex:"She have a meeting → She has a meeting / It sound great → It sounds great"},
 {re:/\b(?:you|we|they) (?:is|has|was)\b/, check:(m,n)=>!AUX_BEFORE.has(prevWord(n,m.index)), msg:"you/we/they 주어에는 are, have, were를 써요.", ex:"They is → They are / We has → We have"},
 {re:/\ba ([aeiou][a-z]*)\b/, check:m=>!/^(uni|use|usu|uti|eu|one|once|ur)/.test(m[1]), msg:"모음 소리(a, e, i, o, u)로 시작하는 단어 앞에는 a 대신 an을 써요.", exf:m=>`a ${m[1]} → an ${m[1]}`},
 {re:/\ban ([b-df-hj-np-tv-z][a-z]*)\b/, check:m=>!/^(hour|honest|hono|heir|herb)/.test(m[1]), msg:"자음 소리로 시작하는 단어 앞에는 an 대신 a를 써요.", exf:m=>`an ${m[1]} → a ${m[1]}`},
 {re:/\b(?:want|wants|need|needs|decide|decided|plan|hope|would like) (go|eat|buy|see|meet|do|make|take|get|come|visit|try|watch|check|book|ask|know|have|bring|leave|pay|change|help)\b/, msg:"want / need / would like 뒤에 동사가 올 때는 to를 붙여요.", ex:"I want go → I want to go / I'd like have → I'd like to have"},
 {re:/\bdiscuss(?:ed|ing)? about\b/, msg:"discuss는 about 없이 바로 목적어를 써요.", ex:"discuss about the plan → discuss the plan"},
 {re:/\bexplain(?:ed)? (?:me|us|him|her)\b/, msg:"explain 뒤에 사람이 올 때는 to를 붙여요.", ex:"explain me → explain to me"},
 {re:/\bmarried with\b/, msg:"'~와 결혼했다'는 married to를 써요.", ex:"married with him → married to him"},
 {re:/\bcontact(?:ed)? (?:to|with) (?:me|you|us|him|her|them)\b/, msg:"contact는 전치사 없이 바로 사람을 써요.", ex:"contact to me → contact me"},
 {re:/\breply(?:ied)? (?:me|you|us|him|her|them)\b/, msg:"reply 뒤에는 to를 붙여요.", ex:"reply me → reply to me"},
 {re:/\barriv(?:e|ed|es|ing) to\b/, msg:"arrive는 to가 아니라 at(좁은 장소)이나 in(도시·나라)과 함께 써요.", ex:"arrive to the hotel → arrive at the hotel"},
 {re:/\blisten(?:ed|ing|s)? (?:music|me|him|her|this|the|it)\b/, msg:"listen 뒤에는 to를 붙여요.", ex:"listen music → listen to music"},
 {re:/\b(?:go|goes|going|went|come|came|get|got) to home\b/, msg:"home 앞에는 to를 쓰지 않아요.", ex:"go to home → go home"},
 {re:/\bi very (?:like|want|love|enjoy)\b/, msg:"'정말 좋아해요'는 very가 아니라 really를 써요.", ex:"I very like it → I really like it"},
 {re:/\bvery thank\b/, msg:"'정말 감사해요'는 Thank you very much 순서로 써요.", ex:"very thank you → thank you very much"},
 {re:/\bhow about to\b/, msg:"How about 뒤에는 동사-ing나 명사가 와요.", ex:"How about to meet at six? → How about meeting at six?"},
 {re:/\blook(?:ing)? forward to (see|meet|hear|work|talk|visit)\b/, msg:"look forward to의 to는 전치사라서 뒤에 -ing가 와요.", exf:m=>`look forward to ${m[1]} → look forward to ${m[1]}ing`},
 {re:new RegExp(`\\bsince ${NUMW} (?:year|month|week|day|hour|minute)s?\\b`), msg:"'~동안'(기간)은 for, '~부터'(시작 시점)는 since를 써요.", ex:"since two years → for two years / since 2020 (O)"},
 {re:new RegExp(`\\bduring ${NUMW} (?:year|month|week|day|hour|minute)s?\\b`), msg:"숫자로 된 기간 앞에는 during 대신 for를 써요.", ex:"during three years → for three years"},
 {re:new RegExp(`\\b(?:in|at) ${DAYS}s?\\b`), msg:"요일 앞에는 on을 써요.", ex:"in Saturday → on Saturday"},
 {re:/\bat (?:the )?(?:morning|afternoon|evening)\b/, msg:"아침·오후·저녁 앞에는 in the를 써요. (밤은 at night)", ex:"at morning → in the morning"},
 {re:/\b(?:on|in|at) (?:tomorrow|yesterday|next (?:week|month|year)|last (?:week|month|year|night))\b/, msg:"tomorrow, yesterday, next week 같은 시간 표현 앞에는 전치사를 쓰지 않아요.", ex:"see you on tomorrow → see you tomorrow"},
 {re:/\bi am (interesting|exciting|boring|tiring|confusing|surprising)\b/, msg:"내 감정을 말할 때는 -ing가 아니라 -ed를 써요. (-ing는 '남을 그렇게 만드는')", exf:m=>`I am ${m[1]} → I am ${m[1].replace(/ing$/,"ed")}`},
 {re:/\bmore (better|worse|bigger|faster|easier|cheaper|smaller|larger)\b/, msg:"이미 비교급(-er)이라서 more를 함께 쓰지 않아요.", exf:m=>`more ${m[1]} → ${m[1]}`},
 {re:/\blet us to\b/, msg:"Let's 뒤에는 to 없이 동사원형을 써요.", ex:"Let's to go → Let's go"},
 {re:/\blet us (\w{5,}ing)\b/, check:m=>!ING_OK.has(m[1]), msg:"Let's 뒤에는 동사원형을 써요.", ex:"Let's going → Let's go"},
 {re:/\b(?:tell me|tell us|know|explain to me|wonder|ask you) (?:where|what|when|how|why|who) (?:is|are|was|were|do|does|did)\b/, msg:"문장 속에 들어간 질문(간접의문문)은 '의문사 + 주어 + 동사' 순서로 써요.", ex:"Can you tell me where is the room? → Can you tell me where the room is?"},
 {re:/\bi have (?:\w+ )?(?:\w+ )?years old\b/, msg:"나이는 have가 아니라 be동사로 말해요.", ex:"I have 30 years old → I am 30 years old"}
];

function lcs(a, b){
  const dp = Array(b.length+1).fill(0);
  for (let i=1;i<=a.length;i++){ let prev=0;
    for (let j=1;j<=b.length;j++){ const t=dp[j]; dp[j] = a[i-1]===b[j-1] ? prev+1 : Math.max(dp[j], dp[j-1]); prev=t; } }
  return dp[b.length];
}
function keyHit(n, key){
  const pad = " " + n + " ";
  return key.split("|").some(alt => { const k = norm(alt); return k && new RegExp("\\s" + k.replace(/[.*+?^${}()|[\]\\]/g,"\\$&")).test(pad); });
}
function evaluate(raw, turn){
  const res = {errors:[], tips:[], missing:[], best:turn.answers[0], sim:0, status:"retry", score:30};
  const text = raw.trim();
  if (/[ㄱ-ㅎㅏ-ㅣ가-힣]/.test(text)){
    res.errors.push({msg:"한글이 섞여 있어요. 영어로만 입력해 주세요.", ex:"모르는 단어는 '모범답안 보기'로 확인해 보세요."});
    res.status="fix"; res.score=0; return res;
  }
  const n = norm(text);
  const words = n ? n.split(" ") : [];
  if (!words.length){ res.status="retry"; res.score=0; return res; }
  for (const r of RULES){
    const m = r.re.exec(n);
    if (m && (!r.check || r.check(m, n))) res.errors.push({msg:r.msg, ex:r.exf ? r.exf(m) : r.ex});
  }
  // 유사도: 모범답안 중 가장 가까운 것
  for (const a of turn.answers){
    const aw = norm(a).split(" ");
    const s = 2*lcs(words, aw)/(words.length + aw.length);
    if (s > res.sim){ res.sim = s; res.best = a; }
  }
  for (const [k, ko] of turn.keys) if (!keyHit(n, k)) res.missing.push({k:k.split("|")[0], ko});
  // 사소한 팁 (점수에 영향 없음)
  if (/(^|\s)i(\s|'|$)/.test(text)) res.tips.push("'I(나)'는 문장 어디에 있든 항상 대문자로 써요.");
  if (/\?\s*$/.test(res.best) && !/\?\s*$/.test(text)) res.tips.push("질문하는 문장이니 끝에 물음표(?)를 붙여 주세요.");
  if (res.errors.length){ res.status="fix"; res.score=50; }
  else if (res.sim >= 0.95){ res.status="perfect"; res.score=100; }
  else if (!res.missing.length || res.sim >= 0.75){ res.status="good"; res.score=Math.min(99, 80 + Math.round(res.sim*20)); }
  else { res.status="retry"; res.score = Math.round(20 + res.sim*30); }
  return res;
}

const STORE_KEY = "talkstep.v1";
let DB = {scores:{}, streak:{last:"", count:0}, settings:{auto:true, rate:1, voice:"", cvoice:"", gap:0, auto4:false, show4:true}, unlocked:false};
try { const s = JSON.parse(localStorage.getItem(STORE_KEY) || "null"); if (s) DB = Object.assign(DB, s); } catch(e){}
DB.settings = Object.assign({auto:true, rate:1, voice:"", cvoice:"", gap:0, auto4:false, show4:true}, DB.settings);
if (DB.settings.slow){ DB.settings.rate = 0.7; delete DB.settings.slow; }
function save(){ try { localStorage.setItem(STORE_KEY, JSON.stringify(DB)); } catch(e){} }
function touchStreak(){
  const d = new Date(); const today = d.toISOString().slice(0,10);
  const y = new Date(d - 864e5).toISOString().slice(0,10);
  if (DB.streak.last === today) return;
  DB.streak.count = DB.streak.last === y ? DB.streak.count + 1 : 1;
  DB.streak.last = today; save();
}

   · 직접 배포한 주소에서 열면: 기기에서 가장 자연스러운 영어 음성을 자동 선택

const V = {tts:null, dict:null, dictNoLang:false};
(async () => { try {
  if (window.claude && typeof window.claude.use === "function"){
    const [t, d] = await Promise.all([window.claude.use("tts").catch(()=>null), window.claude.use("dictation").catch(()=>null)]);
    V.tts = t; V.dict = d;
  } } catch(e){} })();
const CLAUDE_VOICES = {buttery:"부드러운 목소리", airy:"가벼운 목소리", glassy:"맑은 목소리", rounded:"차분한 목소리"};
const SPEEDS = [[0.7,"천천히"],[0.85,"조금 느리게"],[1,"원어민 속도"]];

function englishVoices(){ try { return speechSynthesis.getVoices().filter(v => /^en[-_]/i.test(v.lang)); } catch(e){ return []; } }
function voiceScore(v){
  const n = v.name; let s = 0;
  if (/natural|neural/i.test(n)) s += 60;
  if (/premium|enhanced/i.test(n)) s += 50;
  if (/google us english/i.test(n)) s += 45; else if (/google/i.test(n)) s += 15;
  if (/online/i.test(n)) s += 20;
  if (/samantha|ava|allison|zoe|jenny|aria|guy|evan|nathan|joelle|susan|michelle/i.test(n)) s += 20;
  if (/^en[-_]us/i.test(v.lang)) s += 10;
  if (/compact|eloquence|novelty|whisper|bad news|good news|bells|bubbles|cellos|zarvox|trinoids|albert|jester|organ|superstar|wobble|boing|bahh|fred|junior|ralph|kathy|grandma|grandpa|rocko|shelley|flo|reed|sandy/i.test(n)) s -= 80;
  return s;
}
function rankedVoices(){ return englishVoices().sort((a,b) => voiceScore(b) - voiceScore(a)); }
function pickVoice(){ const vs = rankedVoices(); return vs.find(v => v.name === DB.settings.voice) || vs[0]; }
function speakBrowser(text, rate){
  seqStop();
  try {
    if (!("speechSynthesis" in window)) return toast("이 브라우저는 음성 읽기를 지원하지 않아요.");
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = pickVoice(); if (v){ u.voice = v; u.lang = v.lang; } else u.lang = "en-US";
    u.rate = rate; speechSynthesis.speak(u);
  } catch(e){}
}
function speak(text, rate){
  rate = rate || DB.settings.rate || 1;
  if (V.tts){
    V.tts.speak(text, {language:"en", rate, voice: DB.settings.cvoice || undefined}).catch(e => {
      if (e && (e.code === "unavailable" || e.code === "not_granted")){ V.tts = null; speakBrowser(text, rate); }
      else if (e && e.code === "rate_limited") toast("잠시 후 다시 들어 주세요.");
    });
    return;
  }
  speakBrowser(text, rate);
}

/* ---- 4개국어 읽어 주기: 영어(en-US) → 일어(ja-JP) → 중국어(zh-CN) → 한국어(ko-KR) ---- */
const L4LANGS = [
  {k:"en", lb:"(영어)",   name:"영어",   tts:"en-US"},
  {k:"ja", lb:"(일어)",   name:"일본어", tts:"ja-JP"},
  {k:"zh", lb:"(중국어)", name:"중국어", tts:"zh-CN"},
  {k:"ko", lb:"(한국어)", name:"한국어", tts:"ko-KR"}];
const GAPS = [[0,"자동"],[2,"2초"],[4,"4초"],[6,"6초"]];
let VOICES = [];
function loadVoices(){ try { const v = speechSynthesis.getVoices(); if (v && v.length) VOICES = v; } catch(e){} return VOICES; }
function voicesFor(tts){
  const vs = loadVoices(), base = tts.slice(0,2).toLowerCase();
  const lg = v => String(v.lang || "").replace("_","-").toLowerCase();
  let list = base === "zh" ? vs.filter(v => /^(zh-cn|zh-hans|cmn)/.test(lg(v))) : vs.filter(v => lg(v).startsWith(base));
  if (base === "zh" && !list.length) list = vs.filter(v => /^(zh-tw|zh-hant)/.test(lg(v)));   // 대만 표준중국어 음성(광둥어 zh-HK는 제외)
  const sc = v => (/premium|enhanced|natural|neural/i.test(v.name) ? 50 : 0) + (/google/i.test(v.name) ? 10 : 0) - (/compact|eloquence/i.test(v.name) ? 30 : 0);
  return list.sort((a,b) => sc(b) - sc(a));
}
function voiceFor(tts){ return tts === "en-US" ? (pickVoice() || null) : (voicesFor(tts)[0] || null); }
function hasVoice(tts){ return !loadVoices().length || !!voiceFor(tts); }   // 목록이 아직 안 왔으면 일단 시도
const SEQ = {id:0};
const wait = ms => new Promise(r => setTimeout(r, ms));
function seqStop(){
  SEQ.id++;
  document.querySelectorAll(".l4.now,.l4.rep").forEach(e => e.classList.remove("now","rep"));
  document.querySelectorAll(".p4.on,.l4all.on").forEach(b => { b.classList.remove("on"); if (b.dataset.label) b.innerHTML = b.dataset.label; });
}
function say(text, tts, rate){
  return new Promise(resolve => {
    let fin = false, tm = null;
    const end = r => { if (fin) return; fin = true; clearTimeout(tm); resolve(r); };
    try {
      const u = new SpeechSynthesisUtterance(text);
      const v = voiceFor(tts);
      if (v){ u.voice = v; u.lang = v.lang; } else u.lang = tts;
      u.rate = rate || 1;
      u.onend = () => end("ok");
      u.onerror = e => end(e && (e.error === "interrupted" || e.error === "canceled") ? "stop" : "err");
      tm = setTimeout(() => end("ok"), (6000 + text.length * 350) / Math.min(1, u.rate));   // onend가 안 오는 기기 대비
      speechSynthesis.speak(u);
    } catch(e){ end("err"); }
  });
}
function gapMs(spokenMs){ const g = +DB.settings.gap || 0; return g ? g * 1000 : Math.min(9000, Math.max(1800, spokenMs * 1.1 + 700)); }
const NOTED = {};
function noVoice(el, k){
  const L = L4LANGS.find(x => x.k === k); if (!L) return;
  if (el){ el.classList.add("nov"); const n = el.querySelector(".nv"); if (n) n.hidden = false; }
  if (!NOTED[k]){ NOTED[k] = 1; toast(`이 기기에서 ${L.name} 음성을 찾지 못해 ${L.name} 줄은 건너뛰어요. 아이폰: 설정 › 손쉬운 사용 › 음성 콘텐츠(읽기 및 말하기) › 음성에서 ${L.name}를 추가해 주세요.`, 6500); }
}
function itemOf(el){ const L = L4LANGS.find(x => x.k === el.dataset.k); return {el, k: L.k, tts: L.tts, text: el.dataset.t}; }
// items를 순서대로 읽고, 줄마다 따라 말할 시간을 줍니다. 반드시 터치(클릭) 안에서 처음 호출해야 아이폰에서 소리가 납니다.
async function playLines(items, btn){
  seqStop(); const my = SEQ.id;
  try { if (V.tts) V.tts.stop().catch(()=>{}); } catch(e){}
  if (listening) listening.stop();
  if (!("speechSynthesis" in window)){ toast("이 브라우저는 음성 읽기를 지원하지 않아요."); return; }
  try { speechSynthesis.cancel(); } catch(e){}
  if (btn){ btn.dataset.label = btn.dataset.label || btn.innerHTML; btn.classList.add("on"); btn.innerHTML = "■ 멈추기"; }
  for (const it of items){
    if (SEQ.id !== my) return;
    if (!hasVoice(it.tts)){ noVoice(it.el, it.k); continue; }
    if (it.el){ it.el.classList.add("now"); if (items.length > 4 && it.el.scrollIntoView) try { it.el.scrollIntoView({block:"nearest", behavior:"smooth"}); } catch(e){} }
    const t0 = Date.now();
    const r = await say(it.text, it.tts, DB.settings.rate || 1);
    if (SEQ.id !== my) return;
    if (it.el) it.el.classList.remove("now");
    if (r === "err"){ noVoice(it.el, it.k); continue; }
    if (r === "stop") return seqStop();
    if (it.el) it.el.classList.add("rep");
    await wait(gapMs(Date.now() - t0));
    if (SEQ.id !== my) return;
    if (it.el) it.el.classList.remove("rep");
  }
  if (SEQ.id === my) seqStop();
}
function voiceStatusHtml(){
  if (!("speechSynthesis" in window)) return "이 브라우저는 음성 읽기를 지원하지 않아요.";
  if (!loadVoices().length) return "이 기기의 음성 목록을 불러오는 중이에요. 재생을 누르면 바로 확인돼요.";
  return "이 기기 음성: " + L4LANGS.map(L => `<b class="${voiceFor(L.tts) ? "ok" : "no"}">${L.name} ${voiceFor(L.tts) ? "✓" : "✕"}</b>`).join(" · ");
}
function updVstat(){ document.querySelectorAll(".vstat").forEach(e => e.innerHTML = voiceStatusHtml()); }

const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let listening = null;
let _ns;
function nativeSpeech(){
  if (_ns !== undefined) return _ns;
  try { _ns = IS_NATIVE_APP && typeof window.Capacitor.registerPlugin === "function" ? window.Capacitor.registerPlugin("TalkSpeech") : null; } catch(e){ _ns = null; }

const IS_IOS = /iPad|iPhone|iPod/.test(navigator.userAgent) || (navigator.platform === "MacIntel" && navigator.maxTouchPoints > 1);
const IS_STANDALONE = (window.matchMedia && window.matchMedia("(display-mode: standalone)").matches) || window.navigator.standalone === true;
const IOS_HOME_MIC_MSG = "홈 화면 앱에서는 아이폰이 마이크 음성 입력을 막을 수 있어요. 사파리에서 이 주소를 열어 쓰거나, 입력칸을 누르고 키보드의 🎤(받아쓰기)로 말해 주세요.";
function micError(code){
  if (IS_NATIVE_APP && code === "not_granted") return toast("아이폰 설정 › TalkStep에서 마이크와 음성 인식을 켜 주세요.");
  if (IS_IOS && !IS_NATIVE_APP){
    if (IS_STANDALONE && ["not-allowed","service-not-allowed","not_granted","audio-capture"].includes(code)) return toast(IOS_HOME_MIC_MSG, 6000);
    if (code === "not-allowed" || code === "not_granted") return toast("마이크가 꺼져 있어요. 주소창의 ‘가가’ › 웹 사이트 설정 › 마이크를 ‘허용’으로 바꿔 주세요.", 6000);
    if (code === "service-not-allowed") return toast("아이폰 설정 › 일반 › 키보드 › ‘받아쓰기 활성화’를 켜야 음성 입력을 쓸 수 있어요.", 6000);
  }
  const m = {
    "not_granted":"마이크 권한이 없어요. 브라우저(또는 페이지의 권한 메뉴)에서 마이크를 허용해 주세요.",
    "not-allowed":"마이크 권한이 없어요. 브라우저 설정에서 마이크를 허용해 주세요.",
    "service-not-allowed":"이 브라우저에서는 음성 인식을 쓸 수 없어요. 크롬을 써 주세요.",
    "rate_limited":"잠시 후 다시 눌러 주세요.",
    "network":"음성 인식에 인터넷 연결이 필요해요. 연결을 확인해 주세요.",
    "audio-capture":"마이크를 찾을 수 없어요. 다른 앱이 마이크를 쓰고 있지 않은지 확인해 주세요.",
    "no-speech":"목소리가 들리지 않았어요. 마이크에 조금 더 가까이 말해 주세요.",
    "unavailable":"이 화면에서는 음성 입력을 쓸 수 없어요. 한 번 더 누르면 다른 방식으로 시도해요."
  }[code];
  if (m) toast(m); else if (!["stopped","viewer_stopped","hidden","aborted","dismissed"].includes(code)) toast("음성을 알아듣지 못했어요. 다시 말해 주세요.");
}
let micFails = 0;
// 마이크가 반응하지 않았을 때: 안내 + 대화 화면이면 다른 방법(키보드 받아쓰기·모범답안·건너뛰기) 안내줄을 보여 줌
function micHang(){
  micFails++;
  toast("마이크가 반응하지 않았어요. 한 번 더 눌러 보거나, 입력칸을 누르고 키보드의 🎤(받아쓰기)로 말해 주세요.", 5000);
  const h = document.getElementById("michelp"); if (h) h.hidden = false;
}
function resetListening(){ if (listening){ try { (listening.quiet || listening.stop)(); } catch(e){} } listening = null; document.querySelectorAll(".mic.on,.pmic.on").forEach(b => b.classList.remove("on")); }
// opts: onText(text) 실시간, onDone(text, alternatives[]) 끝났을 때, autoStop(true면 말이 끝나면 자동 종료)
function listen(btn, opts){
  if (listening){ listening.stop(); return; }
  seqStop();
  try { if (V.tts) V.tts.stop().catch(()=>{}); speechSynthesis.cancel(); } catch(e){}
  const onText = opts.onText || (()=>{}), onDone = opts.onDone || (()=>{});
  let ended = false, silent = false; const myId = {};
  const finish = (text, alts) => { if (ended) return; ended = true; btn.classList.remove("on"); if (!listening || listening.id === myId) listening = null; if (silent) return; onDone(text.trim(), alts.map(a=>a.trim()).filter(Boolean)); };
  const NS = nativeSpeech();
  if (NS){   // 아이폰 앱: Apple 음성 인식 사용
    let text = "", alts = [], timer = null, hard = null, guard = null; const hs = [];
    const done = () => { clearTimeout(timer); clearTimeout(hard); clearTimeout(guard); hs.forEach(h => Promise.resolve(h).then(x => x && x.remove()).catch(()=>{})); finish(text, alts.length ? alts : [text]); };
    const stopNow = () => { NS.stop().catch(()=>{}); clearTimeout(guard); guard = setTimeout(done, 3000); };
    hs.push(NS.addListener("result", d => { text = d.text || ""; alts = d.alternatives || [text]; onText(text);
      if (opts.autoStop){ clearTimeout(timer); timer = setTimeout(stopNow, 1500); } }));
    hs.push(NS.addListener("end", d => { if (d && d.error && !text) micError("no-speech"); done(); }));
    btn.classList.add("on");
    listening = {id: myId, stop: stopNow};
    hard = setTimeout(stopNow, 20000);
    NS.start().catch(e => { micError((e && e.code) || "upstream_error"); done(); });
    return;
  }
  if (V.dict){
    const d = V.dict; let fin = "", timer = null; const unsubs = [];
    const done = () => { unsubs.forEach(u => { try{u();}catch(e){} }); clearTimeout(timer); finish(fin, [fin]); };
    unsubs.push(d.onPartial(({text}) => { clearTimeout(timer); onText((fin + " " + text).trim()); }));
    unsubs.push(d.onFinal(({text}) => { fin = (fin + " " + text).trim(); onText(fin);
      if (opts.autoStop){ clearTimeout(timer); timer = setTimeout(() => d.stop().catch(()=>{}), 1300); } }));
    unsubs.push(d.onState(({state, reason}) => { if (state === "idle"){ if (reason) micError(reason); done(); } }));
    btn.classList.add("on");
    listening = {id: myId, stop: () => d.stop().catch(()=>{})};
    d.start(V.dictNoLang ? undefined : {language:"en"}).catch(e => {
      if (e && e.code === "unavailable"){ if (!V.dictNoLang) V.dictNoLang = true; else V.dict = null; }
      if (!ended){ micError(e && e.code); done(); }
    });
    return;
  }
  if (!SR && IS_IOS) return toast(IS_STANDALONE ? IOS_HOME_MIC_MSG : "이 아이폰에서는 음성 입력을 쓸 수 없어요. iOS를 14.5 이상으로 업데이트하거나, 키보드의 🎤(받아쓰기)로 말해 주세요.", 6000);
  if (!SR) return toast("이 브라우저는 음성 입력을 지원하지 않아요. 크롬(PC·안드로이드)이나 사파리(아이폰)를 써 주세요.");
  try {
    const r = new SR(); r.lang = "en-US"; r.interimResults = true; r.maxAlternatives = 5; r.continuous = false;
    let best = "", alts = [], heard = false, errored = false, wd = null, hard = null;
    // 아이폰 사파리는 음성 재생 직후 등에 인식이 시작된 척만 하고 onresult/onerror/onend를 하나도 보내지 않을 때가 있어요.
    // 그러면 마이크가 계속 '듣는 중'으로 묶여 대답을 못 하므로, 일정 시간 안에 반응이 없으면 강제로 끝냅니다.
    const clearT = () => { clearTimeout(wd); clearTimeout(hard); };
    const force = () => { clearT(); try { r.abort(); } catch(e){}
      if (!ended){ if (!best && !errored) micHang(); finish(best, alts.length ? alts : [best]); } };
    wd = setTimeout(() => { if (!heard) force(); }, 7000);
    hard = setTimeout(force, 20000);
    r.onresult = e => {
      best = Array.from(e.results).map(x => x[0].transcript).join(" ");
      const last = e.results[e.results.length-1];
      if (last.isFinal){ const head = Array.from(e.results).slice(0,-1).map(x => x[0].transcript).join(" ");
        alts = Array.from(last).map(a => (head + " " + a.transcript).trim()); }
      heard = true; onText(best.trim());
    };
    r.onspeechstart = () => { heard = true; };
    r.onerror = e => { errored = true; micError(e.error); };
    r.onend = () => { clearT(); finish(best, alts.length ? alts : [best]); };
    btn.classList.add("on");
    listening = {id: myId, stop: () => { try { r.stop(); } catch(e){} clearTimeout(wd); wd = setTimeout(force, 1500); }, quiet: () => { errored = true; silent = true; force(); }};
    r.start();
  } catch(e){ btn.classList.remove("on"); listening = null; micHang(); toast(IS_IOS && IS_STANDALONE ? IOS_HOME_MIC_MSG : "음성 입력을 시작할 수 없어요.", IS_IOS && IS_STANDALONE ? 6000 : undefined); }
}

/* ---- 발음 코치 ---- */
const FUNC = new Set("a an the to of for in on at by with and or but is am are was were be been do does did have has had i you he she it we they me my your our their him her us them this that can could will would should may might must just so if as from up not there here please its it's i'm i'll i've i'd you're we're they're that's there's what's let's don't doesn't didn't isn't aren't can't won't".split(" "));
const AUXQ = /^(do|does|did|is|are|am|was|were|can|could|will|would|should|may|might|have|has|shall)\b/i;
const WHQ = /^(what|where|when|why|who|whom|whose|which|how)\b/i;
const tokClean = w => w.toLowerCase().replace(/[^a-z']/g, "");
function nativeTips(sentence){
  const toks = sentence.split(/\s+/).filter(Boolean), out = [], link = [], flap = [], youC = [];
  const n = " " + norm(sentence) + " ";
  const RED = [[/ want to /,"want to → 워너 (wanna)"],[/ going to (?!the |a )/,"going to → 거너 (gonna)"],[/ got to /,"got to → 가러 (gotta)"],
    [/ let me /,"let me → 레미 (lemme)"],[/ give me /,"give me → 기미 (gimme)"],[/ kind of /,"kind of → 카인더"],[/ a lot of /,"a lot of → 얼라러브"],[/ do not know /,"don't know → 도노"]];
  for (const [re, t] of RED) if (re.test(n)) out.push({h:"빠르게 줄여 말하기", t});
  for (let i=0;i<toks.length-1;i++){
    const a = tokClean(toks[i]), b = tokClean(toks[i+1]);
    if (!a || !b || /[,.!?;:]$/.test(toks[i])) continue;
    if (/(t|d)$/.test(a) && /^(you|your)$/.test(b)) youC.push(`${toks[i]} ${toks[i+1].replace(/[^A-Za-z']/g,"")} → ${/t$/.test(a)?"~츄":"~쥬"}`);
    else if (/t$/.test(a) && /^[aeiou]/.test(b) && !/^(i|it)$/.test(a)) flap.push(`${a} ${b}`);
    else if (/[bcdfghklmnprstvxz]$/.test(a) && /^[aeiou]/.test(b)) link.push(`${a}‿${b}`);
  }
  for (const t of toks){ const w = tokClean(t); if (/^[a-z]+[aeiou]tt?(er|y|ing|ed|ain|o)$/.test(w) && !/^(let|get|set|sit)/.test(w) || /^[a-z]*[aeiou]t(er|ing)$/.test(w)) flap.push(w); }
  if (youC.length) out.push({h:"t/d + you 는 한 소리로", t:youC.slice(0,2).join(" / ")});
  if (flap.length) out.push({h:"모음 사이 t는 부드러운 ㄹ", t:[...new Set(flap)].slice(0,3).join(", ") + " — 미국식은 t를 ‘ㄹ’처럼 굴려요 (water → 워러)"});
  if (link.length) out.push({h:"이어서 한 단어처럼(연음)", t:[...new Set(link)].slice(0,3).join(", ") + " — 앞 단어 끝 자음을 다음 모음에 붙여요"});
  const s = sentence.trim();
  if (/\?$/.test(s)) out.push(AUXQ.test(s) ? {h:"억양", t:"예/아니오 질문은 끝을 올려요 ↗"} : WHQ.test(s) ? {h:"억양", t:"의문사(what, where…) 질문은 끝을 내려요 ↘"} : {h:"억양", t:"질문이니 끝을 살짝 올려요 ↗"});
  return out;
}
function wordTips(words){
  const tips = new Map();
  for (const w0 of words){ const w = tokClean(w0); if (!w) continue;
    if (/r/.test(w) && /l/.test(w)) tips.set("rl","R과 L이 함께 있어요: R은 혀를 어디에도 닿지 않게 뒤로 말고, L은 혀끝을 윗니 뒤에 꾹 붙여요.");
    else if (/r/.test(w)) tips.set("r",`${w0}: R은 혀끝이 입천장에 닿지 않게 뒤로 말아요. (ㄹ처럼 튕기지 않기)`);
    else if (/l/.test(w)) tips.set("l",`${w0}: L은 혀끝을 윗니 바로 뒤에 붙였다 떼요.`);
    if (/f|ph/.test(w)) tips.set("f",`${w0}: F는 ‘ㅍ’가 아니에요. 윗니를 아랫입술에 살짝 대고 바람을 내보내요.`);
    if (/v/.test(w)) tips.set("v",`${w0}: V는 ‘ㅂ’가 아니에요. F 입모양에서 목을 울려요.`);
    if (/th/.test(w)) tips.set("th",`${w0}: TH는 혀끝을 윗니와 아랫니 사이로 살짝 내밀고 소리 내요.`);
    if (/z/.test(w)) tips.set("z",`${w0}: Z는 ‘ㅈ’가 아니라 ‘ㅅ’ 소리에 목을 울리는 벌 소리예요.`);
    if (/^w/.test(w)) tips.set("w",`${w0}: W는 입술을 동그랗게 모았다가 펴면서 시작해요.`);
    if (/[bdgkpt]$/.test(w) && w.length > 2) tips.set("end",`${w0}: 끝 자음 뒤에 ‘으’를 붙이지 마세요. (desk: 데스크 ✗ → 데슼 ○)`);
  }
  return [...tips.values()].slice(0,3);
}
function alignWords(target, heard){
  const a = target, b = heard, m = a.length, n = b.length;
  const dp = Array.from({length:m+1}, () => new Array(n+1).fill(0));
  for (let i=1;i<=m;i++) for (let j=1;j<=n;j++) dp[i][j] = a[i-1]===b[j-1] ? dp[i-1][j-1]+1 : Math.max(dp[i-1][j], dp[i][j-1]);
  const hit = new Array(m).fill(false); let i=m, j=n;
  while (i>0 && j>0){ if (a[i-1]===b[j-1]){ hit[i-1]=true; i--; j--; } else if (dp[i-1][j] >= dp[i][j-1]) i--; else j--; }
  return hit;
}
function scorePron(target, alts){
  const toks = target.split(/\s+/).filter(Boolean);
  const flat = [], owner = [];
  toks.forEach((t,k) => norm(t).split(" ").filter(Boolean).forEach(w => { flat.push(w); owner.push(k); }));
  let best = {score:-1};
  for (const alt of alts){
    const hit = alignWords(flat, norm(alt).split(" ").filter(Boolean));
    const score = flat.length ? Math.round(hit.filter(Boolean).length / flat.length * 100) : 0;
    if (score > best.score){ const ok = toks.map(() => true); hit.forEach((h,x) => { if (!h) ok[owner[x]] = false; }); best = {score, ok, heard:alt}; }
  }
  return best;
}
function openPron(target, onScore){
  const toks = target.split(/\s+/).filter(Boolean);
  const tips = nativeTips(target);
  sheet(`<h2>발음 코치</h2>
    <p class="pmeta">원어민 음성을 듣고 → 마이크를 눌러 똑같이 따라 말해 보세요. <b>굵은 단어</b>는 강하게, 나머지는 약하고 빠르게 말하면 원어민 리듬이 돼요. 단어를 누르면 그 단어만 천천히 들려줘요.</p>
    <p class="ptarget" id="pt">${toks.map((t,i) => `<button class="pw${FUNC.has(tokClean(t)) ? "" : " st"}" data-i="${i}">${esc(t)}</button>`).join(" ")}</p>
    <div class="prow">${SPEEDS.map(([r,l]) => `<button class="mini" data-r="${r}">${ICON.spk} ${l}</button>`).join("")}</div>
    ${tips.length ? `<div class="ptips"><b>원어민처럼 말하는 팁</b><ul>${tips.map(x => `<li><span>${esc(x.h)}</span> ${esc(x.t)}</li>`).join("")}</ul></div>` : ""}
    <button class="btn pri pmic" id="pmic">${ICON.mic} 눌러서 따라 말하기</button>
    <p class="pheard" id="ph" hidden></p>
    <div id="pres"></div>
    <div style="display:flex;justify-content:flex-end"><button class="btn" id="pcx">닫기</button></div>`);
  const sh = document.getElementById("sheet");
  sh.querySelectorAll("[data-r]").forEach(b => b.onclick = () => speak(target, +b.dataset.r));
  sh.querySelectorAll(".pw").forEach(b => b.onclick = () => speak(b.textContent.replace(/[^A-Za-z' -]/g,""), 0.7));
  document.getElementById("pcx").onclick = () => { if (listening) listening.stop(); closeSheet(); };
  const mic = document.getElementById("pmic"), ph = document.getElementById("ph");
  mic.onclick = () => {
    const wasOn = !!listening;
    listen(mic, {autoStop:true,
      onText: t => { ph.hidden = false; ph.textContent = "들린 문장: " + t; },
      onDone: (text, alts) => {
        if (!text) return;
        const r = scorePron(target, alts.length ? alts : [text]);
        ph.hidden = false; ph.textContent = "들린 문장: " + r.heard;
        sh.querySelectorAll(".pw").forEach((b,i) => { b.classList.toggle("ok", r.ok[i]); b.classList.toggle("bad", !r.ok[i]); });
        const missed = toks.filter((_,i) => !r.ok[i]);
        const wt = wordTips(missed);
        const grade = r.score >= 90 ? "원어민이 바로 알아듣는 발음이에요!" : r.score >= 70 ? "좋아요! 빨간 단어만 다시 연습해 보세요." : "천천히 듣기로 한 단어씩 따라 한 뒤 다시 도전해 보세요.";
        document.getElementById("pres").innerHTML = `<div class="fb ${r.score>=90?"perfect":r.score>=70?"retry":"fix"}"><div class="head"><span>${grade}</span><span class="score">${r.score}점</span></div>
          ${missed.length ? `<div>잘 안 들린 단어: ${missed.map(w => `<b>${esc(w)}</b>`).join(", ")}</div>` : ""}
          ${wt.length ? `<ul>${wt.map(x => `<li>${esc(x)}</li>`).join("")}</ul>` : ""}</div>`;
        mic.innerHTML = `${ICON.mic} 다시 따라 말하기`;
        if (onScore) onScore(r.score);
      }});
    if (!wasOn && listening) mic.innerHTML = `${ICON.mic} 듣는 중… (끝나면 다시 눌러 멈추기)`;
  };
  speak(target);
}

function l4row(k, main, rd, pr){
  const L = L4LANGS.find(x => x.k === k);

  return `<div class="l4 ${k}" data-k="${k}" data-t="${esc(main)}"><span class="lb">${L.lb}</span><div class="tx"><div class="m"${lang}>${esc(main)}</div>`
    + (rd ? `<div class="rd"${k === "ja" ? ' lang="ja"' : ""}>${esc(rd)}</div>` : "")
    + (pr ? `<div class="pr">(${esc(pr)})</div>` : "")
    + `<div class="cue">🗣 따라 말해 보세요</div><div class="nv" hidden>🔇 이 기기에 ${L.name} 음성이 없어요</div></div>`
    + `<button class="mini sp" data-say aria-label="${L.name} 다시 듣기">${ICON.spk}</button></div>`;
}
function card4(en, ko0, fold){
  const o = LANG4[en];
  const btn = `<div class="c4b"><button class="mini p4" data-play4 data-label="▶ 4개국어 이어 듣기">▶ 4개국어 이어 듣기</button></div>`;
  if (!o) return `<div class="c4${fold ? " fold" : ""}">${l4row("en", en, "", "")}${ko0 ? l4row("ko", ko0, "", "") : ""}<p class="c4miss">일어·중국어 문장은 준비 중이에요.</p>${btn}</div>`;
  return `<div class="c4${fold ? " fold" : ""}">${l4row("en", en, "", o.enK)}${l4row("ja", o.ja, o.jaR || "", o.jaK)}${l4row("zh", o.zh, o.py, o.zhK)}${l4row("ko", o.ko || ko0 || "", "", "")}${btn}</div>`;
}
function gapChips(){ return `<div class="opt"><span>따라 말할 시간 (줄마다 멈춤)</span><div class="chips" style="margin:0">${GAPS.map(([g,l]) => `<button class="chip" data-gap="${g}" aria-pressed="${(+DB.settings.gap || 0) === g}">${l}</button>`).join("")}</div></div>`; }

  const s = SCENARIOS.find(x=>x.id===id);

  resetListening();
  run = {s, i:0, results:s.turns.map(()=>({score:0, answer:"", tried:false})), peeked:false, waiting:false};

}
